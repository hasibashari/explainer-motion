<!doctype html>
<html lang="id">
<!-- File preview sementara untuk melihat dan menguji starter Bang Motion di browser. Bukan bagian inti dari Agent Skill. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bang Motion — Preview Sementara Agent Skill</title>
<meta name="description" content="Preview sementara untuk menguji starter explainer Bang Motion (Cartoon Stage, Continuous Action, dan Cartoon Collage).">
<meta property="og:title" content="Bang Motion — Preview Sementara Agent Skill">
<meta property="og:description" content="Preview sementara untuk menguji starter explainer Bang Motion (Cartoon Stage, Continuous Action, dan Cartoon Collage).">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0c0f16;
    --panel: #141925;
    --panel-2: #1b2233;
    --border: #273046;
    --ink: #eef2fa;
    --muted: #98a4be;
    --accent: #3b82f6;
    --accent-soft: rgba(59, 130, 246, 0.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .app { display: grid; grid-template-columns: 310px 1fr; height: 100vh; overflow: hidden; }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--border);
  }
  .brand img { width: 34px; height: 34px; border-radius: 8px; flex: 0 0 auto; }
  .brand h1 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .brand p { font-size: 12px; color: var(--muted); }
  .nav { flex: 1; overflow-y: auto; padding: 14px 12px 20px; }
  .section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 8px 8px 6px;
  }
  .item {
    width: 100%;
    text-align: left;
    background: transparent;
    color: var(--ink);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 10px 11px;
    margin-bottom: 5px;
    cursor: pointer;
    display: block;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .item:hover { background: var(--panel-2); }
  .item.active { background: var(--accent-soft); border-color: rgba(59, 130, 246, 0.5); }
  .item strong { display: block; font-size: 13.5px; font-weight: 600; }
  .item span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .foot-note {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--muted);
  }
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .current-meta h2 { font-size: 14px; font-weight: 600; }
  .current-meta code { font-size: 12px; color: var(--muted); }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--muted);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 10px;
    cursor: pointer;
    user-select: none;
  }
  .toggle input { accent-color: var(--accent); cursor: pointer; }
  .ratio-group {
    display: inline-flex;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
  }
  .ratio-btn {
    background: transparent;
    color: var(--muted);
    border: 0;
    padding: 6px 10px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .ratio-btn.active { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  .btn {
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 11px;
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
    text-decoration: none;
  }
  .btn:hover { border-color: var(--accent); }
  .stage-wrap {
    flex: 1;
    position: relative;
    background: #06080d;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
  iframe.portrait {
    width: min(420px, 100%);
    height: min(748px, calc(100% - 28px));
    border-radius: 14px;
    border: 1px solid var(--border);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
  }
  .gallery-view {
    display: none;
    width: 100%;
    height: 100%;
    overflow-y: auto;
    padding: 24px;
    background: var(--bg);
  }
  .gallery-view.open { display: block; }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 18px;
    max-width: 1240px;
    margin: 0 auto;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: block;
    color: inherit;
    text-decoration: none;
    transition: border-color 0.14s ease;
  }
  .card:hover { border-color: var(--accent); }
  .card img { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; display: block; background: #0f172a; }
  .card-body { padding: 14px 16px; }
  .card-body strong { display: block; font-size: 14px; }
  .card-body p { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { max-height: 36vh; border-right: 0; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <img src="./icon.svg" alt="Bang Motion">
      <div>
        <h1>Bang Motion v2.1</h1>
        <p>Preview Sementara (Non-Core)</p>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot-note">File visualisasi sementara untuk menguji starter di browser (bukan bagian inti Agent Skill). Pintasan: <b>Space</b> jeda · <b>R</b> ulang.</div>
  </aside>
  <main>
    <header>
      <div class="current-meta">
        <h2 id="title">Memuat...</h2>
        <code id="path"></code>
      </div>
      <div class="controls">
        <div class="ratio-group" id="ratioGroup" title="Simulasi jendela preview 16:9 atau 9:16">
          <button type="button" class="ratio-btn active" data-ratio="16:9">16:9</button>
          <button type="button" class="ratio-btn" data-ratio="9:16">9:16</button>
        </div>
        <label class="toggle" id="debugWrap"><input type="checkbox" id="optDebug" checked> <span>?debug=1 (scrub &amp; QC)</span></label>
        <button class="btn" id="reloadBtn" type="button">Muat Ulang</button>
        <a class="btn" id="directLink" href="#" target="_self">Buka Langsung</a>
      </div>
    </header>
    <div class="stage-wrap">
      <iframe id="frame" title="Preview Sementara Bang Motion"></iframe>
      <div class="gallery-view" id="galleryView">
        <div class="gallery-grid" id="galleryGrid"></div>
      </div>
    </div>
  </main>
</div>

<script>
const ITEMS = [
  { group: 'Starter Explainer', id: 'stage', name: 'Cartoon Stage (Kartun Panggung)', path: './assets/starter-cartoon-stage.html', desc: 'Satu panggung hidup per adegan, rig sendi aditif, zoom logaritmik, nol caption', supportsDebug: true },
  { group: 'Starter Explainer', id: 'action', name: 'Continuous Action (Aksi Kontinu)', path: './assets/starter-continuous-action.html', desc: 'Dunia parallax mengalir D(t), kabin speedometer, simulasi peta, odometer', supportsDebug: true },
  { group: 'Starter Explainer', id: 'collage', name: 'Cartoon Collage (Kartun Kolase)', path: './assets/starter-cartoon-collage.html', desc: 'Kertas krem dinamis, cutout ber-drop-shadow, polaroid/stempel, push-through', supportsDebug: true },
  { group: 'Referensi Visual (SVG)', id: 'gallery', name: '7 Lembar Diagram Beranotasi', path: './references/visuals/', desc: 'Single source of truth visual untuk kamera/9:16, skala 1 H, Good vs Bad, dan 3 gaya', isGallery: true }
];

const GALLERY = [
  ['shared-scale-perspective.svg', 'Lintas Gaya · Skala 1 H, Camera Angle, & Perspektif', 'Tangga proporsi 1 H (anak 0,68 H, sedan 0,87 H, pintu 1,24 H, gedung 3+ H), 4 sudut kamera & cakrawala, 2.5D & parallax.'],
  ['stage-anatomy.svg', 'Cartoon Stage · Anatomi Panggung', '3 bidang kedalaman flat, garis tanah y=0, ch.sdJ, ≥10 benda bergerak, teks diegetik saja, zoom 1,08–1,95×.'],
  ['stage-poses-expressions.svg', 'Cartoon Stage · Rig Aditif J(), Pose, & Ekspresi', 'Hierarki sendi aditif anti-lepas, rentang sudut anatomis, 6 siluet pose + anticipation, dan 6 ekspresi wajah.'],
  ['continuous-viewpoints-continuity.svg', 'Continuous Action · 7 Sudut Pandang & Aliran D(t)', 'Z-order #deepObjs di belakang subjek, 3 Subject Anchors, arah kiri→kanan, dan katalog 7 viewpoint full-frame.'],
  ['collage-spatial-blueprints.svg', 'Cartoon Collage · Spatial World Map & Akresi', 'Grid zig-zag dx=2600/dy=1700, sizeWorld(), akresi 3–5 elemen, jeda +0.1s pasca-home(), dan .cut/.cut-body.'],
  ['shared-camera-composition.svg', 'Lintas Gaya · Kamera, Framing, & Safe Area 9:16', 'Katalog shot WS/MS/MCU/CU, Rule of Thirds, Lead Room, zona aman vertikal .safe, dan pola gerak kamera.'],
  ['shared-good-vs-bad.svg', 'Lintas Gaya · Perbandingan Baik vs Buruk (F-01..F-06)', 'Kontras visual langsung pola gagal vs standar benar untuk kalibrasi perencanaan & validasi QC.']
];

const navEl = document.getElementById('nav');
const frameEl = document.getElementById('frame');
const galleryView = document.getElementById('galleryView');
const galleryGrid = document.getElementById('galleryGrid');
const titleEl = document.getElementById('title');
const pathEl = document.getElementById('path');
const debugWrap = document.getElementById('debugWrap');
const ratioGroup = document.getElementById('ratioGroup');
const optDebug = document.getElementById('optDebug');
const reloadBtn = document.getElementById('reloadBtn');
const directLink = document.getElementById('directLink');

galleryGrid.innerHTML = GALLERY.map(([file, title, desc]) => `
  <a class="card" href="./references/visuals/${file}" target="_self">
    <img src="./references/visuals/${file}" alt="${title}" loading="lazy">
    <div class="card-body"><strong>${title}</strong><p>${desc}</p></div>
  </a>
`).join('');

let current = ITEMS[0];

function renderNav() {
  const groups = [...new Set(ITEMS.map(i => i.group))];
  navEl.innerHTML = groups.map(group => {
    const buttons = ITEMS.filter(i => i.group === group).map(item => `
      <button type="button" class="item ${item.id === current.id ? 'active' : ''}" data-id="${item.id}">
        <strong>${item.name}</strong>
        <span>${item.desc}</span>
      </button>
    `).join('');
    return `<div class="section-title">${group}</div>${buttons}`;
  }).join('');

  navEl.querySelectorAll('.item').forEach(btn => {
    btn.addEventListener('click', () => {
      const next = ITEMS.find(i => i.id === btn.dataset.id);
      if (next) selectItem(next);
    });
  });
}

function buildUrl(item) {
  if (item.isGallery) return item.path;
  return item.supportsDebug && optDebug.checked ? `${item.path}?debug=1` : item.path;
}

function loadCurrent() {
  titleEl.textContent = current.name;
  debugWrap.style.display = current.supportsDebug ? 'inline-flex' : 'none';
  ratioGroup.style.display = current.isGallery ? 'none' : 'inline-flex';

  if (current.isGallery) {
    pathEl.textContent = './references/visuals/';
    frameEl.style.display = 'none';
    frameEl.src = 'about:blank';
    galleryView.classList.add('open');
    reloadBtn.style.display = 'none';
    directLink.style.display = 'none';
    return;
  }

  const url = buildUrl(current);
  pathEl.textContent = url;
  galleryView.classList.remove('open');
  frameEl.style.display = 'block';
  reloadBtn.style.display = 'inline-block';
  directLink.style.display = 'inline-block';
  directLink.href = url;
  frameEl.src = url;
}

function selectItem(item) {
  current = item;
  renderNav();
  loadCurrent();
}

ratioGroup.querySelectorAll('.ratio-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    ratioGroup.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    frameEl.classList.toggle('portrait', btn.dataset.ratio === '9:16');
  });
});

optDebug.addEventListener('change', loadCurrent);
reloadBtn.addEventListener('click', loadCurrent);

selectItem(ITEMS[0]);
</script>
</body>
</html>
