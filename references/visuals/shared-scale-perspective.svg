<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Lembar Referensi Skala Semi-Realistis 1H, Camera Angle, dan Perspektif 2.5D">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #162033; stroke: #2b3a55; stroke-width: 1.5; }
      .title { font: 700 22px/1.2 system-ui, -apple-system, sans-serif; fill: #f8fafc; }
      .sub { font: 500 13px/1.3 system-ui, -apple-system, sans-serif; fill: #94a3b8; }
      .h2 { font: 700 15px/1.2 system-ui, sans-serif; fill: #f1f5f9; }
      .lbl { font: 700 12px/1.2 system-ui, sans-serif; fill: #f8fafc; }
      .note { font: 500 11px/1.3 system-ui, sans-serif; fill: #cbd5e1; }
      .mono { font: 600 11px/1.2 ui-monospace, SFMono-Regular, monospace; fill: #38bdf8; }
      .hz { stroke: #f59e0b; stroke-width: 1.8; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>

  <!-- Header -->
  <text x="36" y="40" class="title">SKALA SEMI-REALISTIS (1 H = 1,7 m), CAMERA ANGLE, &amp; PERSPEKTIF</text>
  <text x="36" y="60" class="sub">Acuan konsistensi ukuran objek (manusia, pintu, mobil, rumah, pohon) &amp; kedalaman ruang · Mencegah kegagalan F-07</text>
  <rect x="1012" y="22" width="232" height="32" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/>
  <text x="1128" y="42" text-anchor="middle" class="mono">ID: VIS-SHARED-SCALE</text>

  <!-- TOP PANEL: 1H Semi-Realistic Proportion Scale Ladder -->
  <g id="panel-scale-ladder" transform="translate(36, 78)">
    <rect class="card" width="1208" height="300" rx="12"/>
    <text x="20" y="28" class="h2">1. Tangga Proporsi Berbasis Jangkar Manusia (1 H = 1,7 m · Baseline Cartoon Stage ≈ 330–345 px, rig baseScale 0.60)</text>
    <text x="20" y="46" class="note">Cek cepat: kepala tokoh wajib &lt; ambang pintu · atap sedan sejajar dada/bahu · untuk gedung tinggi gunakan Low-Angle + Crop/Tilt (jangan diperkecil jadi mainan).</text>

    <!-- Scale baseline grid -->
    <g transform="translate(20, 62)">
      <rect width="1168" height="218" rx="8" fill="#0b1324" stroke="#334155"/>
      <!-- Reference height lines: baseline y = 192, 1H = 56px in this chart -->
      <line x1="16" y1="192" x2="1152" y2="192" stroke="#22c55e" stroke-width="2"/>
      <!-- 1.0 H line (y = 136) -->
      <line x1="16" y1="136" x2="1152" y2="136" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="5 4"/>
      <text x="24" y="130" class="mono">1.0 H (1,7 m · ~340 px)</text>
      <!-- 2.0 H line (y = 80) -->
      <line x1="16" y1="80" x2="1152" y2="80" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="24" y="74" class="note">2.0 H (3,4 m)</text>
      <!-- 3.0 H line (y = 24) -->
      <line x1="16" y1="24" x2="1152" y2="24" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="24" y="18" class="note">3.0 H (5,1 m)</text>

      <!-- Child 0.68 H (38px) -->
      <g transform="translate(182, 192)">
        <rect x="-8" y="-26" width="16" height="26" rx="4" fill="#60a5fa"/>
        <circle cx="0" cy="-32" r="7" fill="#fde68a"/>
        <text x="0" y="18" text-anchor="middle" class="note">Anak</text>
        <text x="0" y="-44" text-anchor="middle" class="mono">0.68H</text>
      </g>

      <!-- Adult 1.00 H (56px) -->
      <g transform="translate(248, 192)">
        <rect x="-11" y="-40" width="22" height="40" rx="5" fill="#38bdf8"/>
        <circle cx="0" cy="-48" r="9" fill="#fde68a"/>
        <text x="0" y="18" text-anchor="middle" class="lbl" fill="#38bdf8">Dewasa</text>
        <text x="0" y="-62" text-anchor="middle" class="mono">1.00H</text>
      </g>

      <!-- Motorbike 0.65 H (36px x 68px) -->
      <g transform="translate(338, 192)">
        <circle cx="-20" cy="-10" r="10" fill="#475569" stroke="#cbd5e1" stroke-width="2"/>
        <circle cx="20" cy="-10" r="10" fill="#475569" stroke="#cbd5e1" stroke-width="2"/>
        <path d="M-20 -14 L-6 -28 L16 -28 L24 -14 Z" fill="#f97316"/>
        <line x1="12" y1="-28" x2="18" y2="-36" stroke="#e2e8f0" stroke-width="3"/>
        <text x="0" y="18" text-anchor="middle" class="note">Motor</text>
        <text x="0" y="-44" text-anchor="middle" class="mono">0.65H</text>
      </g>

      <!-- Sedan 0.87 H (49px x 146px) -->
      <g transform="translate(486, 192)">
        <path d="M-72 -12 L-70 -30 L-44 -48 L22 -48 L48 -30 L72 -26 L72 -12 Z" fill="#e11d48"/>
        <path d="M-40 -44 L18 -44 L38 -30 L-50 -30 Z" fill="#93c5fd"/>
        <circle cx="-42" cy="-11" r="11" fill="#1e293b" stroke="#cbd5e1" stroke-width="2.5"/>
        <circle cx="42" cy="-11" r="11" fill="#1e293b" stroke="#cbd5e1" stroke-width="2.5"/>
        <text x="0" y="18" text-anchor="middle" class="note">Sedan (0.87×2.6H)</text>
        <text x="0" y="-56" text-anchor="middle" class="mono">0.87H</text>
      </g>

      <!-- Door 1.24 H (69px x 32px) -->
      <g transform="translate(616, 192)">
        <rect x="-18" y="-69" width="36" height="69" rx="3" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
        <circle cx="10" cy="-34" r="3" fill="#f59e0b"/>
        <text x="0" y="18" text-anchor="middle" class="note">Pintu</text>
        <text x="0" y="-76" text-anchor="middle" class="mono">1.24H</text>
      </g>

      <!-- Van / SUV 1.15 H (64px x 156px) -->
      <g transform="translate(756, 192)">
        <path d="M-76 -12 L-76 -62 Q-76 -64 -70 -64 L36 -64 L62 -36 L76 -32 L76 -12 Z" fill="#f8fafc"/>
        <rect x="-76" y="-34" width="152" height="8" fill="#f97316"/>
        <path d="M22 -58 L36 -58 L54 -38 L22 -38 Z" fill="#38bdf8"/>
        <circle cx="-46" cy="-12" r="12" fill="#1e293b" stroke="#cbd5e1" stroke-width="2.5"/>
        <circle cx="46" cy="-12" r="12" fill="#1e293b" stroke="#cbd5e1" stroke-width="2.5"/>
        <text x="0" y="18" text-anchor="middle" class="note">Van / SUV</text>
        <text x="0" y="-72" text-anchor="middle" class="mono">1.15H</text>
      </g>

      <!-- 1-Floor House 1.95H wall + 0.88H roof (109 + 49 = 158px) -->
      <g transform="translate(954, 192)">
        <rect x="-78" y="-109" width="132" height="109" fill="#f4ecdc"/>
        <rect x="54" y="-109" width="24" height="109" fill="#d8cbb2"/>
        <polygon points="-86,-109 -12,-158 62,-109" fill="#e06d4b"/>
        <polygon points="-12,-158 62,-109 84,-109 10,-158" fill="#b85337"/>
        <rect x="-12" y="-69" width="34" height="69" fill="#274c5e"/>
        <rect x="-60" y="-76" width="34" height="32" fill="#fde68a" stroke="#274c5e" stroke-width="2"/>
        <text x="0" y="18" text-anchor="middle" class="note">Rumah 1 Lt (2.83H)</text>
        <text x="0" y="-164" text-anchor="middle" class="mono">1.95H + atap</text>
      </g>

      <!-- Tree / Street Lamp 3.0 H (168px) -->
      <g transform="translate(1100, 192)">
        <rect x="-6" y="-92" width="12" height="92" fill="#7c563c"/>
        <circle cx="0" cy="-118" r="36" fill="#22c55e"/>
        <circle cx="-24" cy="-98" r="24" fill="#16a34a"/>
        <circle cx="24" cy="-98" r="22" fill="#15803d"/>
        <text x="0" y="18" text-anchor="middle" class="note">Pohon (3H)</text>
        <text x="0" y="-160" text-anchor="middle" class="mono">2.7–3.5H</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM LEFT: 4 Camera Angles & Horizon Line -->
  <g id="panel-camera-angles" transform="translate(36, 396)">
    <rect class="card" width="796" height="292" rx="12"/>
    <text x="20" y="28" class="h2">2. Empat Camera Angle &amp; Posisi Garis Cakrawala (Horizon Line)</text>

    <!-- 1. Eye-Level -->
    <g transform="translate(20, 48)">
      <rect width="178" height="128" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="0" y="72" width="178" height="56" fill="#334155"/>
      <line x1="0" y1="68" x2="178" y2="68" class="hz"/>
      <rect x="108" y="34" width="52" height="62" fill="#64748b"/>
      <rect x="34" y="68" width="16" height="36" rx="4" fill="#38bdf8"/>
      <circle cx="42" cy="60" r="8" fill="#fde68a"/>
      <text x="8" y="16" class="mono">1. EYE-LEVEL</text>
      <text x="0" y="148" class="lbl">Sejajar Mata (y ≈ 55%)</text>
      <text x="0" y="164" class="note">Netral, jujur secara skala.</text>
      <text x="0" y="180" class="note">Mata sejajar cakrawala.</text>
      <text x="0" y="198" class="mono">Default interaksi tokoh</text>
    </g>

    <!-- 2. Low-Angle -->
    <g transform="translate(212, 48)">
      <rect width="178" height="128" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="0" y="100" width="178" height="28" fill="#334155"/>
      <line x1="0" y1="100" x2="178" y2="100" class="hz"/>
      <!-- Converging tall building going above frame -->
      <polygon points="82,108 94,0 154,0 166,108" fill="#475569"/>
      <polygon points="154,0 168,0 174,108 166,108" fill="#334155"/>
      <circle cx="44" cy="84" r="6" fill="#fde68a"/>
      <rect x="38" y="90" width="12" height="22" rx="3" fill="#38bdf8"/>
      <text x="8" y="16" class="mono">2. LOW-ANGLE</text>
      <text x="0" y="148" class="lbl">Mendongak (y ≈ 78%)</text>
      <text x="0" y="164" class="note">Gedung/mesin menjulang</text>
      <text x="0" y="180" class="note">di-crop tepi atas + tilt.</text>
      <text x="0" y="198" class="mono">Kesan megah &amp; masif</text>
    </g>

    <!-- 3. High-Angle -->
    <g transform="translate(404, 48)">
      <rect width="178" height="128" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
      <rect x="0" y="28" width="178" height="100" fill="#334155"/>
      <line x1="0" y1="28" x2="178" y2="28" class="hz"/>
      <!-- Perspective road widening downward -->
      <polygon points="74,28 104,28 150,128 28,128" fill="#475569"/>
      <line x1="89" y1="28" x2="89" y2="128" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 5"/>
      <rect x="64" y="84" width="16" height="24" rx="4" fill="#e11d48"/>
      <rect x="102" y="54" width="12" height="18" rx="3" fill="#38bdf8"/>
      <text x="8" y="16" class="mono">3. HIGH-ANGLE</text>
      <text x="0" y="148" class="lbl">Menunduk (y ≈ 22%)</text>
      <text x="0" y="164" class="note">Jalan &amp; sistem tampak</text>
      <text x="0" y="180" class="note">meluas ke belakang.</text>
      <text x="0" y="198" class="mono">Alur rute &amp; skala kota</text>
    </g>

    <!-- 4. OTS / Foreground Framing -->
    <g transform="translate(596, 48)">
      <rect width="178" height="128" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
      <rect x="0" y="82" width="178" height="46" fill="#334155"/>
      <line x1="0" y1="78" x2="178" y2="78" class="hz"/>
      <!-- Midground focus subject -->
      <rect x="92" y="42" width="52" height="44" rx="4" fill="#f59e0b"/>
      <!-- Large dark Foreground Silhouette -->
      <circle cx="18" cy="116" r="46" fill="#090e1a"/>
      <circle cx="168" cy="18" r="32" fill="#090e1a"/>
      <text x="8" y="16" class="mono">4. FG FRAMING</text>
      <text x="0" y="148" class="lbl">Lapis Depan (1.5–2.2×)</text>
      <text x="0" y="164" class="note">Siluet gelap dekat lensa</text>
      <text x="0" y="180" class="note">membingkai subjek MG.</text>
      <text x="0" y="198" class="mono">Ilusi kedalaman instan</text>
    </g>
  </g>

  <!-- BOTTOM RIGHT: Perspective, Color Script 70-20-10, & Vector Lighting Rules -->
  <g id="panel-depth-rules" transform="translate(852, 396)">
    <rect class="card" width="392" height="292" rx="12"/>
    <text x="20" y="28" class="h2">3. Color Script 70–20–10, Cahaya, &amp; Parallax</text>

    <g transform="translate(20, 48)">
      <rect width="352" height="66" rx="8" fill="#0f172a" stroke="#38bdf8"/>
      <text x="14" y="22" class="lbl" fill="#38bdf8">A. Kedalaman 4 Lapis &amp; Color Script 70–20–10</text>
      <text x="14" y="40" class="note">70% BG/Latar analogus tenang → 20% Arsitektur MG</text>
      <text x="14" y="56" class="note">→ 10% Subjek kontras tajam + FG gelap pengunci tepi.</text>
    </g>

    <g transform="translate(20, 126)">
      <rect width="352" height="66" rx="8" fill="#0f172a" stroke="#f59e0b"/>
      <text x="14" y="22" class="lbl" fill="#f59e0b">B. Light Anchor, 2,5D, &amp; 2-Tone Craft</text>
      <text x="14" y="40" class="note">1 arah cahaya konsisten → sisi 2,5D sh(hex, 0.85),</text>
      <text x="14" y="56" class="note">2-tone split, pantulan kaca diagonal, &amp; light beam.</text>
    </g>

    <g transform="translate(20, 204)">
      <rect width="352" height="68" rx="8" fill="#0f172a" stroke="#22c55e"/>
      <text x="14" y="22" class="lbl" fill="#22c55e">C. Rasio Parallax Continuous Action</text>
      <text x="14" y="40" class="mono">Awan 0.06 · Gunung 0.16 · Bukit 0.36</text>
      <text x="14" y="56" class="mono">Ladang 0.64 · Jalur 1.00 · Tiang FG 1.45</text>
    </g>
  </g>
</svg>
