<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Continuous Action: Katalog 7 Sudut Pandang, Arah Gerak, dan Kontinuitas Subjek">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #162033; stroke: #2b3a55; stroke-width: 1.5; }
      .title { font: 700 22px/1.2 system-ui, -apple-system, sans-serif; fill: #f8fafc; }
      .sub { font: 500 13px/1.3 system-ui, -apple-system, sans-serif; fill: #94a3b8; }
      .h2 { font: 700 15px/1.2 system-ui, sans-serif; fill: #f1f5f9; }
      .lbl { font: 700 12px/1.2 system-ui, sans-serif; fill: #f8fafc; }
      .note { font: 500 11px/1.3 system-ui, sans-serif; fill: #cbd5e1; }
      .mono { font: 600 11px/1.2 ui-monospace, SFMono-Regular, monospace; fill: #38bdf8; }
    </style>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#f97316"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="720"/>

  <!-- Header -->
  <text x="36" y="40" class="title">CONTINUOUS ACTION — 7 SUDUT PANDANG, ARAH GERAK, &amp; ALIRAN D(t)</text>
  <text x="36" y="60" class="sub">Standar kanonik v2.1 · 100% full-frame per sudut pandang (NOL dashboard inset), angka hidup di #deepObjs, arah layar konsisten kiri → kanan</text>
  <rect x="1030" y="22" width="214" height="32" rx="6" fill="#1e293b" stroke="#f97316" stroke-width="1.2"/>
  <text x="1137" y="42" text-anchor="middle" class="mono">ID: VIS-CONT-VIEW</text>

  <!-- Top Row: Canonical Side View Anatomy + Layer Depth -->
  <g id="panel-side-anatomy" transform="translate(36, 80)">
    <rect class="card" width="780" height="286" rx="12"/>
    <text x="20" y="28" class="h2">1. Anatomi Lapisan #side (Subjek Melaju Kiri → Kanan, Dunia Mengalir Kanan → Kiri)</text>

    <g transform="translate(20, 44)">
      <rect width="740" height="176" rx="8" fill="#162a45" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- BG hills parallax 0.25 -->
      <path d="M0 124 Q120 74 260 112 T540 94 T740 116 L740 176 L0 176 Z" fill="#1e3a5f"/>
      <!-- #deepObjs BIG NUMBER BEHIND SUBJECT (parallax 0.8) -->
      <text x="356" y="114" text-anchor="middle" font-family="system-ui" font-size="78" font-weight="900" fill="#38bdf8" opacity="0.34">320</text>
      <text x="464" y="114" font-family="system-ui" font-size="22" font-weight="800" fill="#93c5fd" opacity="0.55">KM/J</text>
      <!-- Track & speed lines -->
      <rect x="0" y="138" width="740" height="38" fill="#0f172a"/>
      <line x1="0" y1="138" x2="740" y2="138" stroke="#64748b" stroke-width="4"/>
      <line x1="34" y1="62" x2="146" y2="62" stroke="#93c5fd" stroke-width="2" opacity="0.45"/>
      <line x1="560" y1="48" x2="688" y2="48" stroke="#93c5fd" stroke-width="2" opacity="0.45"/>

      <!-- Hero Subject IN FRONT OF #deepObjs -->
      <g transform="translate(230, 96)">
        <path d="M0 36 L0 12 Q0 2 18 2 L206 2 Q256 2 282 26 Q288 32 282 36 Z" fill="#f8fafc"/>
        <path d="M8 22 L268 22 L276 28 L8 28 Z" fill="#f97316"/>
        <rect x="28" y="8" width="32" height="10" rx="3" fill="#0f172a"/>
        <rect x="70" y="8" width="32" height="10" rx="3" fill="#0f172a"/>
        <rect x="112" y="8" width="32" height="10" rx="3" fill="#0f172a"/>
        <rect x="154" y="8" width="32" height="10" rx="3" fill="#0f172a"/>
        <path d="M204 8 L244 8 L260 18 L204 18 Z" fill="#38bdf8"/>
        <circle cx="48" cy="40" r="7" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
        <circle cx="222" cy="40" r="7" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
      </g>

      <!-- Direction Arrows -->
      <path d="M530 112 L640 112" stroke="#f97316" stroke-width="3.5" marker-end="url(#arr-orange)"/>
      <text x="536" y="102" class="lbl" fill="#f97316">SUBJEK: KIRI → KANAN</text>
      <path d="M180 158 L70 158" stroke="#22c55e" stroke-width="3" marker-end="url(#arr-green)"/>
      <text x="72" y="170" class="mono">DUNIA D(t): KANAN → KIRI</text>

      <!-- Layer Callouts -->
      <rect x="14" y="12" width="214" height="22" rx="4" fill="#0f172a" stroke="#38bdf8"/>
      <text x="121" y="27" text-anchor="middle" class="mono">Z-ORDER: BG → #deepObjs → HERO</text>
    </g>

    <text x="20" y="244" class="note">• <tspan fill="#f8fafc" font-weight="700">Angka di belakang subjek:</tspan> Subjek melintas di depan angka besar di #deepObjs, lalu angka tersapu keluar ke kiri.</text>
    <text x="20" y="264" class="note">• <tspan fill="#f8fafc" font-weight="700">Saat angka dibaca:</tspan> Turunkan kecepatan VK ke ~35–45% agar dunia TETAP mengalir (dilarang berhenti total seperti slide).</text>
  </g>

  <!-- Top Right: 3 Subject Anchor Locks -->
  <g id="panel-anchors" transform="translate(836, 80)">
    <rect class="card" width="408" height="286" rx="12"/>
    <text x="20" y="28" class="h2">2. Kunci Identitas Subjek (Lintas View)</text>
    <text x="20" y="48" class="note">Wajib konsisten di semua sudut pandang agar tidak membingungkan:</text>

    <rect x="20" y="66" width="368" height="58" rx="8" fill="#0f172a" stroke="#f97316"/>
    <circle cx="46" cy="95" r="14" fill="#f8fafc" stroke="#f97316" stroke-width="4"/>
    <text x="72" y="88" class="lbl">1. Warna Bodi + Garis Aksen (--accent)</text>
    <text x="72" y="106" class="note">Dipakai seragam di #side, jarum #cabin, &amp; titik #map.</text>

    <rect x="20" y="136" width="368" height="58" rx="8" fill="#0f172a" stroke="#38bdf8"/>
    <path d="M32 172 L46 154 L62 154 L68 172 Z" fill="#38bdf8"/>
    <text x="72" y="158" class="lbl">2. Siluet Khas yang Terbaca Instan</text>
    <text x="72" y="176" class="note">Moncong/helm/bodi sama dari samping maupun depan.</text>

    <rect x="20" y="206" width="368" height="58" rx="8" fill="#0f172a" stroke="#22c55e"/>
    <path d="M34 236 L58 236" stroke="#22c55e" stroke-width="3" marker-end="url(#arr-green)"/>
    <text x="72" y="228" class="lbl">3. Arah Layar + Transisi Palet paletteAt()</text>
    <text x="72" y="246" class="note">Peta mengalir dominan kiri → kanan selaras #side.</text>
  </g>

  <!-- Bottom Full Width: 7 Viewpoints Catalog & Rhythm Chain -->
  <g id="panel-7-views" transform="translate(36, 384)">
    <rect class="card" width="1208" height="304" rx="12"/>
    <text x="20" y="28" class="h2">3. Katalog 7 Sudut Pandang Penuh (Dilarang 3 Adegan Berurutan dengan Sudut Sama · Pindah Pakai whip())</text>

    <!-- 7 cards across -->
    <!-- 1. #side -->
    <g transform="translate(20, 48)">
      <rect width="156" height="168" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="78" y="20" text-anchor="middle" class="mono">1. SAMPING (#side)</text>
      <rect x="14" y="34" width="128" height="66" rx="4" fill="#1e293b"/>
      <rect x="34" y="64" width="76" height="18" rx="6" fill="#f8fafc"/>
      <rect x="38" y="72" width="68" height="4" fill="#f97316"/>
      <text x="78" y="120" text-anchor="middle" class="lbl">Jangkar Pembuka</text>
      <text x="78" y="138" text-anchor="middle" class="note">Parallax 3 lapis</text>
      <text x="78" y="154" text-anchor="middle" class="note">&amp; angka #deepObjs</text>
    </g>

    <!-- 2. #cabin -->
    <g transform="translate(188, 48)">
      <rect width="156" height="168" rx="8" fill="#0f172a" stroke="#f97316" stroke-width="1.5"/>
      <text x="78" y="20" text-anchor="middle" class="mono">2. KABIN (#cabin)</text>
      <rect x="14" y="34" width="128" height="66" rx="4" fill="#1e293b"/>
      <circle cx="78" cy="68" r="22" fill="none" stroke="#f97316" stroke-width="3"/>
      <line x1="78" y1="68" x2="94" y2="56" stroke="#22c55e" stroke-width="3"/>
      <text x="78" y="120" text-anchor="middle" class="lbl">Kecepatan / Tenaga</text>
      <text x="78" y="138" text-anchor="middle" class="note">Jarum vAt(t) &amp;</text>
      <text x="78" y="154" text-anchor="middle" class="note">tabular-nums</text>
    </g>

    <!-- 3. #map -->
    <g transform="translate(356, 48)">
      <rect width="156" height="168" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
      <text x="78" y="20" text-anchor="middle" class="mono">3. PETA (#map)</text>
      <rect x="14" y="34" width="128" height="66" rx="4" fill="#1e293b"/>
      <path d="M26 84 Q66 44 126 56" fill="none" stroke="#22c55e" stroke-width="3"/>
      <circle cx="96" cy="54" r="5" fill="#f97316"/>
      <text x="78" y="120" text-anchor="middle" class="lbl">Rute &amp; Jarak</text>
      <text x="78" y="138" text-anchor="middle" class="note">stroke-dasharray</text>
      <text x="78" y="154" text-anchor="middle" class="note">zoom 2.3× → 1.0×</text>
    </g>

    <!-- 4. Elevation Profile -->
    <g transform="translate(524, 48)">
      <rect width="156" height="168" rx="8" fill="#0f172a" stroke="#64748b"/>
      <text x="78" y="20" text-anchor="middle" class="mono">4. PROFIL MEDAN</text>
      <rect x="14" y="34" width="128" height="66" rx="4" fill="#1e293b"/>
      <path d="M18 92 L52 54 L94 74 L122 46 L138 92 Z" fill="#334155"/>
      <path d="M20 82 L134 62" fill="none" stroke="#f97316" stroke-width="2.5" stroke-dasharray="4 3"/>
      <text x="78" y="120" text-anchor="middle" class="lbl">Tanjakan / Tunnel</text>
      <text x="78" y="138" text-anchor="middle" class="note">Kontur ketinggian</text>
      <text x="78" y="154" text-anchor="middle" class="note">&amp; terowongan</text>
    </g>

    <!-- 5. Map Race -->
    <g transform="translate(692, 48)">
      <rect width="156" height="168" rx="8" fill="#0f172a" stroke="#64748b"/>
      <text x="78" y="20" text-anchor="middle" class="mono">5. BALAPAN PETA</text>
      <rect x="14" y="34" width="128" height="66" rx="4" fill="#1e293b"/>
      <line x1="24" y1="54" x2="128" y2="54" stroke="#f97316" stroke-width="3"/>
      <circle cx="118" cy="54" r="5" fill="#f97316"/>
      <line x1="24" y1="78" x2="128" y2="78" stroke="#64748b" stroke-width="3"/>
      <circle cx="72" cy="78" r="5" fill="#94a3b8"/>
      <text x="78" y="120" text-anchor="middle" class="lbl">Banding Waktu</text>
      <text x="78" y="138" text-anchor="middle" class="note">Tanpa split-card</text>
      <text x="78" y="154" text-anchor="middle" class="note">1 jam berjalan</text>
    </g>

    <!-- 6. Interior Perspective -->
    <g transform="translate(860, 48)">
      <rect width="156" height="168" rx="8" fill="#0f172a" stroke="#64748b"/>
      <text x="78" y="20" text-anchor="middle" class="mono">6. INTERIOR</text>
      <rect x="14" y="34" width="128" height="66" rx="4" fill="#1e293b"/>
      <path d="M18 96 L56 54 L100 54 L138 96" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <rect x="34" y="72" width="18" height="14" rx="2" fill="#f97316"/>
      <rect x="104" y="72" width="18" height="14" rx="2" fill="#f97316"/>
      <text x="78" y="120" text-anchor="middle" class="lbl">Kapasitas / Unit</text>
      <text x="78" y="138" text-anchor="middle" class="note">Deret menyala &amp;</text>
      <text x="78" y="154" text-anchor="middle" class="note">jendela mengalir</text>
    </g>

    <!-- 7. Head-On -->
    <g transform="translate(1028, 48)">
      <rect width="160" height="168" rx="8" fill="#0f172a" stroke="#64748b"/>
      <text x="80" y="20" text-anchor="middle" class="mono">7. TAMPAK DEPAN</text>
      <rect x="14" y="34" width="132" height="66" rx="4" fill="#1e293b"/>
      <path d="M58 92 Q60 44 80 44 Q100 44 102 92 Z" fill="#f8fafc"/>
      <rect x="64" y="54" width="32" height="12" rx="3" fill="#38bdf8"/>
      <circle cx="66" cy="80" r="4" fill="#facc15"/>
      <circle cx="94" cy="80" r="4" fill="#facc15"/>
      <text x="80" y="120" text-anchor="middle" class="lbl">Momen Klimaks</text>
      <text x="80" y="138" text-anchor="middle" class="note">Mendekat dari titik</text>
      <text x="80" y="154" text-anchor="middle" class="note">hilang penuh frame</text>
    </g>

    <!-- Bottom Rhythm Bar -->
    <rect x="20" y="232" width="1168" height="54" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="36" y="254" class="lbl" fill="#22c55e">CONTOH RITME 60 DETIK:</text>
    <text x="216" y="254" class="mono">#side (0–10s) ─whip→ #cabin (10–20s) ─whip→ #map (20–32s) ─whip→ Profil (32–42s) ─whip→ Balapan (42–52s) ─whip→ #side (52–60s)</text>
    <text x="36" y="274" class="note">Jebakan SVG wajib dihindari: JANGAN pakai setAttribute('visibility','visible') pada anak view (pakai removeAttribute('visibility') agar tidak tembus saat whip).</text>
  </g>
</svg>
