<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Perbandingan Visual Baik vs Buruk untuk Cartoon Stage, Continuous Action, dan Cartoon Collage">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font: 700 22px/1.2 system-ui, -apple-system, sans-serif; fill: #f8fafc; }
      .sub { font: 500 13px/1.3 system-ui, -apple-system, sans-serif; fill: #94a3b8; }
      .bad-box { fill: #1f1218; stroke: #ef4444; stroke-width: 1.8; }
      .good-box { fill: #0f211c; stroke: #22c55e; stroke-width: 1.8; }
      .badge-bad { fill: #ef4444; }
      .badge-good { fill: #16a34a; }
      .badge-txt { font: 700 11px/1 system-ui, sans-serif; fill: #ffffff; }
      .h3 { font: 700 13.5px/1.2 system-ui, sans-serif; fill: #f1f5f9; }
      .note { font: 500 11px/1.3 system-ui, sans-serif; fill: #cbd5e1; }
      .mono { font: 600 11px/1.2 ui-monospace, SFMono-Regular, monospace; fill: #38bdf8; }
    </style>
    <filter id="paperShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#221e1b" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect class="bg" width="1280" height="720"/>

  <!-- Header -->
  <text x="36" y="40" class="title">PERBANDINGAN BAIK vs BURUK — POLA KEGAGALAN F-01 s.d. F-07</text>
  <text x="36" y="60" class="sub">Gunakan sebagai tolok ukur diskriminatif pada Langkah 2 (Beat Sheet) &amp; Langkah 5 (QC) · Kalibrasi skala F-07 di shared-scale-perspective.svg</text>
  <rect x="1030" y="22" width="214" height="32" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="1137" y="42" text-anchor="middle" class="mono">ID: VIS-SHARED-GVB</text>

  <!-- ROW 1: CARTOON STAGE -->
  <g id="row-cartoon-stage" transform="translate(36, 78)">
    <!-- BAD -->
    <rect class="bad-box" width="594" height="196" rx="10"/>
    <rect class="badge-bad" x="14" y="12" width="176" height="22" rx="4"/>
    <text x="102" y="27" text-anchor="middle" class="badge-txt">BURUK · F-01 &amp; F-02 (STAGE)</text>
    <g transform="translate(14, 44)">
      <rect width="230" height="134" rx="6" fill="#f8fafc"/>
      <text x="14" y="24" font-family="system-ui" font-size="12" font-weight="700" fill="#1e293b">Judul Slide Presentasi</text>
      <rect x="14" y="34" width="110" height="6" rx="2" fill="#94a3b8"/>
      <rect x="14" y="46" width="95" height="6" rx="2" fill="#cbd5e1"/>
      <rect x="14" y="58" width="102" height="6" rx="2" fill="#cbd5e1"/>
      <!-- Floating character with detached neck -->
      <circle cx="176" cy="48" r="10" fill="#f97316"/>
      <rect x="166" y="66" width="20" height="28" rx="4" fill="#3b82f6"/>
      <line x1="176" y1="58" x2="176" y2="66" stroke="#ef4444" stroke-width="2" stroke-dasharray="2 2"/>
      <text x="150" y="114" font-family="system-ui" font-size="9.5" font-weight="700" fill="#dc2626">Melayang tanpa tanah!</text>
      <rect x="8" y="118" width="214" height="12" rx="2" fill="#1e293b" opacity="0.8"/>
      <text x="115" y="127" text-anchor="middle" font-family="system-ui" font-size="8" fill="#fff">Caption overlay (DILARANG)</text>
    </g>
    <text x="260" y="64" class="h3">Pelanggaran F-01 (Slide) &amp; F-02 (Rig Lepas)</text>
    <text x="260" y="86" class="note">✗ Ada judul + bullet + caption overlay di layar</text>
    <text x="260" y="106" class="note">✗ Panggung sepi (&lt;10 elemen bergerak), zoom &lt; 1.08×</text>
    <text x="260" y="126" class="note">✗ Kaki melayang tanpa bayangan kontak (ch.sdJ)</text>
    <text x="260" y="146" class="note">✗ Leher/sendi lepas karena GSAP transformOrigin</text>
    <text x="260" y="170" class="mono">Fix: Hapus teks, pakai J() aditif, isi ≥10 aksi</text>

    <!-- GOOD -->
    <g transform="translate(614, 0)">
      <rect class="good-box" width="594" height="196" rx="10"/>
      <rect class="badge-good" x="14" y="12" width="156" height="22" rx="4"/>
      <text x="92" y="27" text-anchor="middle" class="badge-txt">BENAR · CARTOON STAGE</text>
      <g transform="translate(14, 44)">
        <rect width="230" height="134" rx="6" fill="#bfe3e8"/>
        <path d="M0 90 Q60 66 120 84 T230 78 L230 134 L0 134 Z" fill="#9bd3a8"/>
        <rect x="0" y="102" width="230" height="32" fill="#77b887"/>
        <!-- Cloud & Sun -->
        <circle cx="196" cy="24" r="12" fill="#facc15"/>
        <ellipse cx="48" cy="24" rx="18" ry="8" fill="#ffffff"/>
        <!-- Building with diegetic sign -->
        <rect x="136" y="46" width="76" height="58" rx="3" fill="#e07a5f"/>
        <rect x="146" y="34" width="56" height="14" rx="2" fill="#1e293b"/>
        <text x="174" y="44" text-anchor="middle" font-family="system-ui" font-size="8.5" font-weight="700" fill="#facc15">PASAR</text>
        <!-- Grounded character with shadow -->
        <ellipse cx="72" cy="108" rx="16" ry="4" fill="#0f172a" opacity="0.22"/>
        <rect x="64" y="88" width="6" height="19" rx="2" fill="#1e3a8a"/>
        <rect x="74" y="88" width="6" height="19" rx="2" fill="#1e3a8a"/>
        <rect x="61" y="64" width="22" height="26" rx="5" fill="#2563eb"/>
        <circle cx="72" cy="54" r="11" fill="#fde68a"/>
        <path d="M83 72 L106 62" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
      </g>
      <text x="260" y="64" class="h3">Panggung Hidup Penuh &amp; Rig Terkunci</text>
      <text x="260" y="86" class="note">✓ Nol caption — teks hanya diegetik ("PASAR")</text>
      <text x="260" y="106" class="note">✓ 3 lapis kedalaman (BG bukit, MG panggung, FG)</text>
      <text x="260" y="126" class="note">✓ Kaki menyentuh tanah + bayangan ch.sdJ sinkron</text>
      <text x="260" y="146" class="note">✓ ≥10 benda bergerak (awan, kipas, asap, daun)</text>
      <text x="260" y="170" class="mono">Zoom: 1.08×–1.95× logaritmik · J() aditif</text>
    </g>
  </g>

  <!-- ROW 2: CONTINUOUS ACTION -->
  <g id="row-continuous-action" transform="translate(36, 290)">
    <!-- BAD -->
    <rect class="bad-box" width="594" height="196" rx="10"/>
    <rect class="badge-bad" x="14" y="12" width="192" height="22" rx="4"/>
    <text x="110" y="27" text-anchor="middle" class="badge-txt">BURUK · F-03 &amp; F-04 (ACTION)</text>
    <g transform="translate(14, 44)">
      <rect width="230" height="134" rx="6" fill="#dbeafe"/>
      <rect x="0" y="96" width="230" height="38" fill="#64748b"/>
      <!-- Subject -->
      <rect x="44" y="76" width="84" height="22" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
      <!-- FORBIDDEN Inset mini-map card -->
      <rect x="148" y="8" width="74" height="44" rx="4" fill="#ffffff" stroke="#ef4444" stroke-width="1.8"/>
      <text x="185" y="24" text-anchor="middle" font-size="8" font-family="system-ui" font-weight="700" fill="#dc2626">MINI-MAP</text>
      <path d="M158 40 Q184 26 212 40" fill="none" stroke="#ef4444" stroke-width="2"/>
      <!-- FORBIDDEN Speedometer widget overlay -->
      <circle cx="196" cy="102" r="22" fill="#ffffff" stroke="#ef4444" stroke-width="1.8"/>
      <text x="196" y="106" text-anchor="middle" font-size="7.5" font-family="system-ui" font-weight="700" fill="#dc2626">GAUGE</text>
      <!-- Multi-line subtitle -->
      <text x="10" y="20" font-family="system-ui" font-size="10" font-weight="700" fill="#1e293b">320 km/h</text>
      <text x="10" y="32" font-family="system-ui" font-size="7.5" fill="#475569">Subjudul panjang 2 baris</text>
      <line x1="8" y1="6" x2="222" y2="128" stroke="#ef4444" stroke-width="2" opacity="0.5"/>
    </g>
    <text x="260" y="64" class="h3">Pelanggaran F-03 (Dashboard Inset) &amp; F-04</text>
    <text x="260" y="86" class="note">✗ Menumpuk mini-map + gauge di atas #side</text>
    <text x="260" y="106" class="note">✗ Angka mengambang jadi HUD overlay 3 tingkat</text>
    <text x="260" y="126" class="note">✗ Terus di sudut samping (tidak ganti viewpoint)</text>
    <text x="260" y="146" class="note">✗ Arah gerak berbalik tiba-tiba setelah transisi</text>
    <text x="260" y="170" class="mono">Fix: Pecah ke #side → whip() → #cabin → #map</text>

    <!-- GOOD -->
    <g transform="translate(614, 0)">
      <rect class="good-box" width="594" height="196" rx="10"/>
      <rect class="badge-good" x="14" y="12" width="180" height="22" rx="4"/>
      <text x="104" y="27" text-anchor="middle" class="badge-txt">BENAR · CONTINUOUS ACTION</text>
      <g transform="translate(14, 44)">
        <!-- 3 separate full-frame views -->
        <rect x="0" y="0" width="72" height="134" rx="5" fill="#1e3a5f" stroke="#38bdf8"/>
        <text x="36" y="64" text-anchor="middle" font-family="system-ui" font-size="22" font-weight="800" fill="#38bdf8" opacity="0.45">320</text>
        <rect x="10" y="80" width="52" height="16" rx="6" fill="#ffffff"/>
        <text x="36" y="18" text-anchor="middle" class="mono">#side</text>
        <text x="36" y="124" text-anchor="middle" font-size="8" font-family="system-ui" fill="#cbd5e1">Angka di</text>
        <text x="36" y="132" text-anchor="middle" font-size="8" font-family="system-ui" fill="#cbd5e1">#deepObjs</text>

        <rect x="79" y="0" width="72" height="134" rx="5" fill="#1e293b" stroke="#f59e0b"/>
        <text x="115" y="18" text-anchor="middle" class="mono">#cabin</text>
        <circle cx="115" cy="76" r="24" fill="none" stroke="#f59e0b" stroke-width="3"/>
        <line x1="115" y1="76" x2="132" y2="62" stroke="#22c55e" stroke-width="3"/>
        <text x="115" y="124" text-anchor="middle" font-size="8" font-family="system-ui" fill="#cbd5e1">Full-frame</text>

        <rect x="158" y="0" width="72" height="134" rx="5" fill="#142925" stroke="#22c55e"/>
        <text x="194" y="18" text-anchor="middle" class="mono">#map</text>
        <path d="M168 96 Q190 48 220 68" fill="none" stroke="#22c55e" stroke-width="3"/>
        <circle cx="204" cy="64" r="5" fill="#f59e0b"/>
        <text x="194" y="124" text-anchor="middle" font-size="8" font-family="system-ui" fill="#cbd5e1">Full-frame</text>
      </g>
      <text x="260" y="64" class="h3">Satu Sudut Penuh per Fakta + Dunia Mengalir</text>
      <text x="260" y="86" class="note">✓ Setiap instrumen mengisi 100% layar via whip()</text>
      <text x="260" y="106" class="note">✓ Angka besar di #deepObjs (di belakang subjek)</text>
      <text x="260" y="126" class="note">✓ Arah gerak konsisten kiri → kanan di semua view</text>
      <text x="260" y="146" class="note">✓ Dunia tetap mengalir ~40% saat angka dibaca</text>
      <text x="260" y="170" class="mono">D(t) deterministik · Maksimum 2 tingkat teks</text>
    </g>
  </g>

  <!-- ROW 3: CARTOON COLLAGE -->
  <g id="row-cartoon-collage" transform="translate(36, 502)">
    <!-- BAD -->
    <rect class="bad-box" width="594" height="196" rx="10"/>
    <rect class="badge-bad" x="14" y="12" width="192" height="22" rx="4"/>
    <text x="110" y="27" text-anchor="middle" class="badge-txt">BURUK · F-05 &amp; F-06 (COLLAGE)</text>
    <g transform="translate(14, 44)">
      <rect width="230" height="134" rx="6" fill="#f5efe2"/>
      <!-- Cutout with ugly white background box & no shadow -->
      <rect x="20" y="42" width="66" height="62" fill="#ffffff" stroke="#ef4444" stroke-dasharray="3 2"/>
      <circle cx="53" cy="73" r="20" fill="#64748b"/>
      <text x="53" y="116" text-anchor="middle" font-size="8" font-family="system-ui" fill="#dc2626">Tanpa drop-shadow</text>
      <!-- Single flat sentence while zooming + leaking neighbor -->
      <text x="102" y="66" font-family="system-ui" font-size="10" font-weight="700" fill="#1e293b">1 gambar + 1 kalimat</text>
      <text x="102" y="80" font-family="system-ui" font-size="8.5" fill="#64748b">muncul serentak</text>
      <!-- Leaking neighbor edge -->
      <rect x="212" y="14" width="18" height="90" fill="#0ea5e9" opacity="0.6"/>
      <text x="180" y="124" font-size="8" font-family="system-ui" font-weight="700" fill="#dc2626">Area sebelah bocor!</text>
    </g>
    <text x="260" y="64" class="h3">Pelanggaran F-05 (Kolase Datar) &amp; F-06 (Bocor)</text>
    <text x="260" y="86" class="note">✗ Hanya 1 cutout + 1 kalimat (pola slideshow)</text>
    <text x="260" y="106" class="note">✗ Drop-shadow hilang krn filter blur di node sama</text>
    <text x="260" y="126" class="note">✗ say() mulai sebelum kamera home() selesai</text>
    <text x="260" y="146" class="note">✗ Jarak area terlalu sempit → area tetangga bocor</text>
    <text x="260" y="170" class="mono">Fix: .cut/.cut-body, akresi 3–5, dx=2600px</text>

    <!-- GOOD -->
    <g transform="translate(614, 0)">
      <rect class="good-box" width="594" height="196" rx="10"/>
      <rect class="badge-good" x="14" y="12" width="166" height="22" rx="4"/>
      <text x="97" y="27" text-anchor="middle" class="badge-txt">BENAR · CARTOON COLLAGE</text>
      <g transform="translate(14, 44)">
        <rect width="230" height="134" rx="6" fill="#f6efe2"/>
        <circle cx="52" cy="40" r="34" fill="#f59e0b" opacity="0.16"/>
        <circle cx="184" cy="96" r="32" fill="#14b8a6" opacity="0.16"/>
        <!-- Cutout 1 with crisp drop shadow -->
        <g filter="url(#paperShadow)" transform="rotate(-4 52 72)">
          <circle cx="52" cy="72" r="24" fill="#f97316"/>
          <circle cx="46" cy="66" r="5" fill="#fff7ed"/>
        </g>
        <!-- Polaroid/Note 2 -->
        <g filter="url(#paperShadow)" transform="rotate(4 166 86)">
          <rect x="136" y="64" width="60" height="46" rx="3" fill="#ffffff"/>
          <rect x="142" y="70" width="48" height="26" fill="#0d9488"/>
        </g>
        <!-- Stamp 3 -->
        <g transform="rotate(-8 176 32)">
          <rect x="146" y="20" width="62" height="20" rx="3" fill="none" stroke="#dc2626" stroke-width="1.8"/>
          <text x="177" y="34" text-anchor="middle" font-size="8.5" font-family="system-ui" font-weight="800" fill="#dc2626">BUKTI #1</text>
        </g>
        <!-- Pill Text 4 -->
        <rect x="20" y="16" width="98" height="22" rx="5" fill="#ea580c"/>
        <text x="69" y="31" text-anchor="middle" font-size="10" font-family="system-ui" font-weight="700" fill="#ffffff">Akresi 3–5</text>
        <!-- Hand arrow 5 -->
        <path d="M84 74 Q112 62 132 78" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4 3"/>
      </g>
      <text x="260" y="64" class="h3">Akresi 3–5 Elemen + Bayangan Kertas Utuh</text>
      <text x="260" y="86" class="note">✓ 5 lapisan bertahap: cutout, polaroid, stamp, pill, coretan</text>
      <text x="260" y="106" class="note">✓ .cut (motion blur) terpisah dari .cut-body (drop-shadow)</text>
      <text x="260" y="126" class="note">✓ say() mulai ≥ +0.1 dtk setelah home() berhenti</text>
      <text x="260" y="146" class="note">✓ Grid spasial dx=2600, dy=1700 + sizeWorld()</text>
      <text x="260" y="170" class="mono">Transisi: into() → settle() di kertas yang sama</text>
    </g>
  </g>
</svg>
