<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Lembar Referensi Kamera, Framing, dan Safe Area 16:9 vs 9:16">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #162033; stroke: #2b3a55; stroke-width: 1.5; }
      .title { font: 700 22px/1.2 system-ui, -apple-system, sans-serif; fill: #f8fafc; }
      .sub { font: 500 13px/1.3 system-ui, -apple-system, sans-serif; fill: #94a3b8; }
      .h2 { font: 700 15px/1.2 system-ui, -apple-system, sans-serif; fill: #e2e8f0; }
      .lbl { font: 600 12px/1.2 system-ui, -apple-system, sans-serif; fill: #cbd5e1; }
      .note { font: 500 11px/1.3 system-ui, -apple-system, sans-serif; fill: #94a3b8; }
      .mono { font: 600 11px/1.2 ui-monospace, SFMono-Regular, monospace; fill: #38bdf8; }
      .danger { fill: rgba(239, 68, 68, 0.22); stroke: #ef4444; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .safe { fill: rgba(34, 197, 94, 0.14); stroke: #22c55e; stroke-width: 2; }
      .grid { stroke: rgba(148, 163, 184, 0.28); stroke-width: 1; stroke-dasharray: 4 4; }
      .accent { fill: #38bdf8; }
      .warn { fill: #f59e0b; }
      .ok { fill: #22c55e; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="720"/>

  <!-- Header -->
  <g id="header">
    <text x="36" y="42" class="title">LEMBAR REFERENSI KAMERA, FRAMING, &amp; SAFE AREA (LINTAS GAYA)</text>
    <text x="36" y="64" class="sub">Prinsip universal untuk Cartoon Stage, Continuous Action, dan Cartoon Collage · Gunakan untuk Langkah 2 (Beat Sheet) &amp; Langkah 4 (Kamera)</text>
    <rect x="1030" y="24" width="214" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="1137" y="44" text-anchor="middle" class="mono">ID: VIS-SHARED-CAM</text>
  </g>

  <!-- Panel 1: Shot Grammar (WS / MS / MCU / CU) -->
  <g id="panel-shot-grammar" transform="translate(36, 86)">
    <rect class="card" width="760" height="292" rx="12"/>
    <text x="20" y="28" class="h2">1. Katalog Ukuran Shot &amp; Rule of Thirds (Jangan 2 Beat Berurutan Identik)</text>
    <text x="20" y="46" class="note">Selalu beri Lead Room di depan arah pandang/gerak subjek · Di Cartoon Stage, WS tetap zoom ≥ 1.08× (anti-miniatur)</text>

    <!-- WS -->
    <g transform="translate(20, 62)">
      <rect width="166" height="106" rx="6" fill="#1e293b" stroke="#475569"/>
      <line x1="55" y1="0" x2="55" y2="106" class="grid"/>
      <line x1="111" y1="0" x2="111" y2="106" class="grid"/>
      <line x1="0" y1="35" x2="166" y2="35" class="grid"/>
      <line x1="0" y1="71" x2="166" y2="71" class="grid"/>
      <rect x="0" y="76" width="166" height="30" fill="#334155"/>
      <rect x="108" y="34" width="44" height="44" rx="3" fill="#64748b"/>
      <circle cx="55" cy="52" r="7" fill="#38bdf8"/>
      <rect x="49" y="60" width="12" height="18" rx="3" fill="#0284c7"/>
      <path d="M66 56 L98 56" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr-amber)"/>
      <text x="8" y="16" class="mono">WS · z 1.08–1.20</text>
      <text x="0" y="124" class="lbl">Wide Shot (Konteks)</text>
      <text x="0" y="140" class="note">Tokoh ~35% tinggi frame.</text>
      <text x="0" y="154" class="note">Memperkenalkan ruang.</text>
    </g>

    <!-- MS -->
    <g transform="translate(204, 62)">
      <rect width="166" height="106" rx="6" fill="#1e293b" stroke="#475569"/>
      <line x1="55" y1="0" x2="55" y2="106" class="grid"/>
      <line x1="111" y1="0" x2="111" y2="106" class="grid"/>
      <line x1="0" y1="35" x2="166" y2="35" class="grid"/>
      <line x1="0" y1="71" x2="166" y2="71" class="grid"/>
      <rect x="0" y="84" width="166" height="22" fill="#334155"/>
      <circle cx="55" cy="40" r="11" fill="#38bdf8"/>
      <rect x="45" y="52" width="20" height="34" rx="4" fill="#0284c7"/>
      <rect x="104" y="42" width="40" height="44" rx="4" fill="#f59e0b" opacity="0.85"/>
      <path d="M68 58 L98 58" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
      <text x="8" y="16" class="mono">MS · z 1.25–1.45</text>
      <text x="0" y="124" class="lbl">Medium Shot (Aksi)</text>
      <text x="0" y="140" class="note">Tokoh + objek interaksi</text>
      <text x="0" y="154" class="note">di sepertiga berlawanan.</text>
    </g>

    <!-- MCU -->
    <g transform="translate(388, 62)">
      <rect width="166" height="106" rx="6" fill="#1e293b" stroke="#475569"/>
      <line x1="55" y1="0" x2="55" y2="106" class="grid"/>
      <line x1="111" y1="0" x2="111" y2="106" class="grid"/>
      <line x1="0" y1="35" x2="166" y2="35" class="grid"/>
      <line x1="0" y1="71" x2="166" y2="71" class="grid"/>
      <circle cx="58" cy="40" r="16" fill="#38bdf8"/>
      <rect x="40" y="58" width="36" height="48" rx="6" fill="#0284c7"/>
      <rect x="102" y="34" width="46" height="32" rx="5" fill="#22c55e" opacity="0.85"/>
      <text x="125" y="54" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="700" fill="#052e16">PROP</text>
      <text x="8" y="16" class="mono">MCU · z 1.50–1.72</text>
      <text x="0" y="124" class="lbl">Medium Close-Up</text>
      <text x="0" y="140" class="note">Fokus emosi tokoh &amp;</text>
      <text x="0" y="154" class="note">reaksi terhadap bukti.</text>
    </g>

    <!-- CU -->
    <g transform="translate(572, 62)">
      <rect width="166" height="106" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="55" y1="0" x2="55" y2="106" class="grid"/>
      <line x1="111" y1="0" x2="111" y2="106" class="grid"/>
      <line x1="0" y1="35" x2="166" y2="35" class="grid"/>
      <line x1="0" y1="71" x2="166" y2="71" class="grid"/>
      <circle cx="83" cy="54" r="30" fill="#f59e0b" opacity="0.22" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="83" cy="54" r="18" fill="#f59e0b"/>
      <line x1="83" y1="54" x2="96" y2="42" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
      <text x="8" y="16" class="mono">CU · z 1.75–1.95</text>
      <text x="0" y="124" class="lbl">Close-Up (Detail)</text>
      <text x="0" y="140" class="note">Jarum, ekspresi, atau</text>
      <text x="0" y="154" class="note">aset pembuka Collage.</text>
    </g>

    <!-- Lead Room Rule Bar -->
    <rect x="20" y="232" width="720" height="44" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="34" y="251" class="lbl" fill="#f59e0b">ATURAN LEAD ROOM &amp; 180-DEGREE:</text>
    <text x="278" y="251" class="note">Menghadap kanan → taruh subjek di x = 33% (kiri), ruang pandang di kanan.</text>
    <text x="34" y="267" class="note">Arah gerak antar-adegan konsisten (kiri → kanan) kecuali ada aksi berbalik arah eksplisit. Teks minimum ≥ 30 px (panggung 1080 px).</text>
  </g>

  <!-- Panel 2: 9:16 Safe Area vs 16:9 -->
  <g id="panel-safe-area" transform="translate(816, 86)">
    <rect class="card" width="428" height="600" rx="12"/>
    <text x="20" y="28" class="h2">2. Zona Aman 9:16 (1080×1920)</text>
    <text x="20" y="46" class="note">Bungkus konten dengan .safe { transform: scale(.78); }</text>
    <text x="20" y="62" class="note">Latar belakang / kertas tetap 100% penuh tanpa tepi hitam.</text>

    <!-- Phone Canvas -->
    <g transform="translate(94, 84)">
      <rect width="240" height="426" rx="16" fill="#0b1220" stroke="#64748b" stroke-width="2"/>
      <!-- Top danger zone (190/1920 * 426 ≈ 42px) -->
      <rect x="2" y="2" width="236" height="46" rx="14" class="danger"/>
      <text x="120" y="24" text-anchor="middle" class="lbl" fill="#fca5a5">ZONA BAHAYA ATAS (±190 px)</text>
      <text x="120" y="38" text-anchor="middle" class="note" fill="#fca5a5">Status bar / Tab Following</text>

      <!-- Bottom danger zone (230/1920 * 426 ≈ 51px) -->
      <rect x="2" y="356" width="236" height="68" rx="14" class="danger"/>
      <text x="120" y="386" text-anchor="middle" class="lbl" fill="#fca5a5">ZONA BAHAYA BAWAH (±230 px)</text>
      <text x="120" y="403" text-anchor="middle" class="note" fill="#fca5a5">Caption platform, audio bar, tombol CTA</text>

      <!-- Right UI icons danger strip -->
      <rect x="196" y="190" width="40" height="156" rx="6" class="danger"/>
      <circle cx="216" cy="218" r="9" fill="#ef4444" opacity="0.5"/>
      <circle cx="216" cy="252" r="9" fill="#ef4444" opacity="0.5"/>
      <circle cx="216" cy="286" r="9" fill="#ef4444" opacity="0.5"/>
      <text x="216" y="328" text-anchor="middle" font-size="9" font-family="system-ui" fill="#fca5a5">UI</text>

      <!-- Safe Zone Box -->
      <rect x="14" y="56" width="174" height="290" rx="8" class="safe"/>
      <text x="101" y="78" text-anchor="middle" class="lbl" fill="#86efac">AREA AMAN KONTEN</text>
      <text x="101" y="94" text-anchor="middle" class="mono">transform-origin: 50% 45%</text>
      <!-- Safe subject inside -->
      <circle cx="101" cy="168" r="24" fill="#38bdf8"/>
      <rect x="76" y="196" width="50" height="64" rx="8" fill="#0284c7"/>
      <rect x="34" y="278" width="134" height="34" rx="6" fill="#f59e0b"/>
      <text x="101" y="299" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="12" fill="#0f172a">TEKS ≥ 30 px</text>
    </g>

    <!-- Bottom tip -->
    <rect x="20" y="526" width="388" height="56" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
    <text x="32" y="546" class="mono">VERIFIKASI DI ?debug=1:</text>
    <text x="32" y="564" class="note">Aktifkan tombol overlay "Safe" saat simulasi 9:16.</text>
    <text x="32" y="577" class="note">Skala #stage pakai translate(-50%,-50%) scale(s), BUKAN CSS Grid.</text>
  </g>

  <!-- Panel 3: Camera Move Signatures per Style -->
  <g id="panel-camera-moves" transform="translate(36, 398)">
    <rect class="card" width="760" height="288" rx="12"/>
    <text x="20" y="28" class="h2">3. Pola Gerak Kamera Resmi per Gaya (Dilarang Hanya Ken Burns 1.0→1.05)</text>

    <!-- Stage camera -->
    <g transform="translate(20, 48)">
      <rect width="228" height="220" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="14" y="24" class="lbl" fill="#38bdf8">CARTOON STAGE</text>
      <text x="14" y="42" class="mono">cam() Zoom Logaritmik</text>
      <rect x="14" y="58" width="200" height="72" rx="6" fill="#1e293b"/>
      <path d="M26 116 L58 116 C82 116 96 76 132 76 L198 76" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="58" cy="116" r="4" fill="#f59e0b"/>
      <circle cx="132" cy="76" r="4" fill="#22c55e"/>
      <text x="24" y="108" class="note">Tahan 0.5s</text>
      <text x="128" y="96" class="note">1 Gerak/Beat</text>
      <text x="14" y="150" class="note">• Rentang zoom: 1.08× – 1.95×</text>
      <text x="14" y="168" class="note">• Antar panggung: cut atau slide</text>
      <text x="14" y="184" class="note">  (96px H / 72px V, blur ≤ 10px)</text>
      <text x="14" y="204" class="mono">setCam(sc, at, x, y, z)</text>
    </g>

    <!-- Continuous Action camera -->
    <g transform="translate(266, 48)">
      <rect width="228" height="220" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="14" y="24" class="lbl" fill="#f59e0b">CONTINUOUS ACTION</text>
      <text x="14" y="42" class="mono">whip() + CAMK + Banking</text>
      <rect x="14" y="58" width="200" height="72" rx="6" fill="#1e293b"/>
      <rect x="24" y="72" width="48" height="42" rx="4" fill="#334155" stroke="#f59e0b"/>
      <text x="48" y="97" text-anchor="middle" class="mono">#side</text>
      <path d="M76 93 L94 93" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)"/>
      <rect x="98" y="72" width="48" height="42" rx="4" fill="#334155" stroke="#38bdf8"/>
      <text x="122" y="97" text-anchor="middle" class="mono">#cabin</text>
      <path d="M150 93 L168 93" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)"/>
      <rect x="172" y="72" width="34" height="42" rx="4" fill="#334155" stroke="#22c55e"/>
      <text x="189" y="97" text-anchor="middle" class="mono">map</text>
      <text x="14" y="150" class="note">• Full-frame whip (0.28s + 0.36s)</text>
      <text x="14" y="168" class="note">• Banking tikungan: 6–12°</text>
      <text x="14" y="184" class="note">• Peta: zoom 2.3× → 1.0× lalu angka</text>
      <text x="14" y="204" class="mono">whip(at, from, to, dir)</text>
    </g>

    <!-- Cartoon Collage camera -->
    <g transform="translate(512, 48)">
      <rect width="228" height="220" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1.2"/>
      <text x="14" y="24" class="lbl" fill="#22c55e">CARTOON COLLAGE</text>
      <text x="14" y="42" class="mono">CU → look → home → into</text>
      <rect x="14" y="58" width="200" height="72" rx="6" fill="#1e293b"/>
      <circle cx="42" cy="94" r="14" fill="none" stroke="#22c55e" stroke-width="2"/>
      <text x="42" y="98" text-anchor="middle" class="mono">CU</text>
      <path d="M58 94 L82 94" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
      <circle cx="102" cy="94" r="14" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <text x="102" y="98" text-anchor="middle" class="mono">look</text>
      <path d="M118 94 L142 94" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
      <rect x="148" y="76" width="54" height="36" rx="4" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <text x="175" y="98" text-anchor="middle" class="mono">home</text>
      <text x="14" y="150" class="note">• Buka di CU (z 1.5–1.8) pd cutA</text>
      <text x="14" y="168" class="note">• say() mulai ≥ +0.1s SETELAH home</text>
      <text x="14" y="184" class="note">• Pindah area: into() → settle()</text>
      <text x="14" y="204" class="mono">sizeWorld() ±1600px margin</text>
    </g>
  </g>
</svg>
