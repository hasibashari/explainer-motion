<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Anatomi Panggung Cartoon Stage Beranotasi">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font: 700 22px/1.2 system-ui, -apple-system, sans-serif; fill: #f8fafc; }
      .sub { font: 500 13px/1.3 system-ui, -apple-system, sans-serif; fill: #94a3b8; }
      .tag { font: 700 11.5px/1.2 system-ui, sans-serif; fill: #0f172a; }
      .lbl { font: 700 12px/1.2 system-ui, sans-serif; fill: #f8fafc; }
      .note { font: 500 11px/1.3 system-ui, sans-serif; fill: #cbd5e1; }
      .mono { font: 600 11px/1.2 ui-monospace, SFMono-Regular, monospace; fill: #38bdf8; }
      .callout-line { stroke: #f8fafc; stroke-width: 1.5; stroke-dasharray: 4 3; }
    </style>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4e2eb"/>
      <stop offset="100%" stop-color="#eff6f1"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1280" height="720"/>

  <!-- Header -->
  <text x="36" y="40" class="title">CARTOON STAGE — ANATOMI PANGGUNG HIDUP &amp; 3 LAPIS KEDALAMAN</text>
  <text x="36" y="60" class="sub">Standar kanonik v2.1 · Palet flat cerah tanpa tekstur, ≥10 benda bergerak bermakna, nol caption, zoom 1.08×–1.95×</text>
  <rect x="1030" y="22" width="214" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="1137" y="42" text-anchor="middle" class="mono">ID: VIS-STAGE-ANAT</text>

  <!-- Main Stage Viewport (Canonical Visual + Annotations) -->
  <g id="canonical-stage" transform="translate(36, 80)">
    <rect width="920" height="518" rx="12" fill="url(#sky)" stroke="#38bdf8" stroke-width="2"/>

    <!-- BG Plane: Sun (top-left Light Direction Anchor), Clouds, Birds, Distant Hills (70% analogous calm palette) -->
    <g id="layer-bg">
      <circle cx="116" cy="78" r="46" fill="#f59e0b" opacity="0.18"/>
      <circle cx="116" cy="78" r="30" fill="#f59e0b" opacity="0.92"/>
      <g fill="#ffffff" opacity="0.94">
        <ellipse cx="290" cy="82" rx="48" ry="17"/>
        <ellipse cx="320" cy="76" rx="34" ry="15"/>
        <ellipse cx="560" cy="68" rx="54" ry="17"/>
        <ellipse cx="596" cy="62" rx="32" ry="13"/>
      </g>
      <!-- Birds (moving #3) -->
      <path d="M406 96 q8 -10 16 0 q8 -10 16 0" fill="none" stroke="#475569" stroke-width="2.4" stroke-linecap="round" opacity="0.65"/>
      <path d="M448 118 q6 -8 12 0 q6 -8 12 0" fill="none" stroke="#475569" stroke-width="2.1" stroke-linecap="round" opacity="0.65"/>
      <!-- Distant Hills (analogous muted sage-teal) -->
      <path d="M0 326 Q180 232 390 304 T920 282 L920 518 L0 518 Z" fill="#cfe3df"/>
      <path d="M0 364 Q260 294 560 348 T920 322 L920 518 L0 518 Z" fill="#a9cbc6"/>
    </g>

    <!-- MG Plane: Ground, Eco House 2.5D + Micro-Geometry + Diegetic Station + 2-Tone Tree + Organic Character -->
    <g id="layer-mg">
      <!-- Ground plane -->
      <rect x="0" y="388" width="920" height="130" fill="#9ac2ad"/>
      <line x1="0" y1="388" x2="920" y2="388" stroke="#1d4b43" stroke-width="2" stroke-dasharray="8 6"/>

      <!-- Left House 2.5D with roof cast shadow, diagonal window reflection & chimney smoke -->
      <rect x="58" y="218" width="196" height="170" fill="#f5f0e6"/>
      <rect x="58" y="218" width="160" height="10" fill="#e2d9c9"/>
      <rect x="218" y="218" width="36" height="170" fill="#d4c9b6"/>
      <polygon points="44,218 156,144 268,218" fill="#d96b4b"/>
      <polygon points="156,144 268,218 286,218 174,144" fill="#b55338"/>
      <!-- Chimney & drift() smoke -->
      <rect x="196" y="138" width="24" height="44" fill="#b45338"/>
      <circle cx="208" cy="116" r="12" fill="#ffffff" opacity="0.72"/>
      <circle cx="220" cy="94" r="15" fill="#ffffff" opacity="0.52"/>
      <circle cx="236" cy="72" r="18" fill="#ffffff" opacity="0.32"/>
      <!-- Solar panel on roof -->
      <polygon points="94,196 154,158 190,180 130,218" fill="#223b4e"/>
      <line x1="112" y1="184" x2="148" y2="206" stroke="#7ad7c6" stroke-width="2"/>
      <line x1="132" y1="172" x2="168" y2="194" stroke="#7ad7c6" stroke-width="2"/>
      <!-- Door & glass window with diagonal reflection -->
      <rect x="92" y="302" width="44" height="86" rx="4" fill="#223b4e"/>
      <rect x="162" y="256" width="46" height="44" rx="4" fill="#d9eff7" stroke="#223b4e" stroke-width="2.5"/>
      <polygon points="170,258 184,258 166,298 163,298" fill="#ffffff" opacity="0.65"/>
      <line x1="185" y1="256" x2="185" y2="300" stroke="#223b4e" stroke-width="2"/>
      <line x1="162" y1="278" x2="208" y2="278" stroke="#223b4e" stroke-width="2"/>

      <!-- Pipe with flowAlong() energy dots -->
      <path d="M254 344 L610 344 L610 318" fill="none" stroke="#223b4e" stroke-width="10" stroke-linecap="round"/>
      <circle cx="304" cy="344" r="4.5" fill="#f59e0b"/>
      <circle cx="384" cy="344" r="4.5" fill="#f59e0b"/>
      <circle cx="464" cy="344" r="4.5" fill="#f59e0b"/>
      <circle cx="544" cy="344" r="4.5" fill="#f59e0b"/>

      <!-- Right Diegetic Station + Spinning Turbine -->
      <rect x="610" y="218" width="234" height="170" rx="6" fill="#223b4e"/>
      <rect x="798" y="218" width="46" height="170" rx="4" fill="#182b3a"/>
      <!-- Diegetic Sign (ONLY text allowed) -->
      <rect x="634" y="182" width="186" height="42" rx="6" fill="#132634"/>
      <text x="727" y="209" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="800" fill="#f59e0b">GARDU ENERGI</text>
      <!-- Gauge + Spinning Fan -->
      <circle cx="672" cy="284" r="28" fill="#f8fafc"/>
      <line x1="672" y1="284" x2="690" y2="268" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="754" cy="284" r="28" fill="#132634"/>
      <g stroke="#7ad7c6" stroke-width="5" stroke-linecap="round">
        <line x1="754" y1="262" x2="754" y2="306"/>
        <line x1="732" y1="284" x2="776" y2="284"/>
      </g>
      <!-- Status LEDs -->
      <circle cx="654" cy="346" r="6" fill="#22c55e"/>
      <circle cx="676" cy="346" r="6" fill="#22c55e"/>
      <circle cx="698" cy="346" r="6" fill="#f59e0b"/>
      <circle cx="720" cy="346" r="6" fill="#ef4444"/>

      <!-- Asymmetrical 2-Tone Swaying Tree (anti-primitive 3-circle) -->
      <path d="M869 388 L871 302 L881 302 L884 388 Z" fill="#76533d"/>
      <path d="M842 308 C836 274 862 246 882 244 C908 242 920 274 912 306 C904 322 850 322 842 308 Z" fill="#327553"/>
      <path d="M842 304 C838 272 862 246 880 246 C896 248 902 272 894 294 C884 310 850 314 842 304 Z" fill="#59ac7d"/>

      <!-- Grounded Organic Character (1/3 left, 3/4 facing right -> 10% high-contrast focal cobalt) -->
      <g id="hero-rig" transform="translate(366, 404)">
        <!-- Ground contact shadow ch.sdJ -->
        <ellipse cx="0" cy="0" rx="44" ry="10" fill="#0f172a" opacity="0.18"/>
        <!-- Legs firmly on y=0 with cuff hems -->
        <rect x="-20" y="-76" width="16" height="72" rx="6" fill="#1e3a5f"/>
        <rect x="6" y="-76" width="16" height="72" rx="6" fill="#172d4a"/>
        <ellipse cx="-10" cy="-4" rx="14" ry="6" fill="#1e293b"/>
        <ellipse cx="18" cy="-4" rx="14" ry="6" fill="#1e293b"/>
        <!-- Torso with collar, 2-tone right shadow, & belt -->
        <rect x="-28" y="-160" width="56" height="90" rx="16" fill="#2563eb"/>
        <path d="M12 -158 C26 -152 28 -134 28 -86 L28 -72 L12 -70 Z" fill="#1d4ed8"/>
        <polygon points="-12,-160 0,-146 12,-160 8,-164 0,-154 -8,-164" fill="#60a5fa"/>
        <rect x="-28" y="-82" width="56" height="9" rx="3" fill="#172d4a"/>
        <rect x="2" y="-83" width="10" height="11" rx="2" fill="#f59e0b"/>
        <!-- Back arm pointing right (RhandSlot) -->
        <path d="M22 -140 L74 -156" stroke="#1d4ed8" stroke-width="15" stroke-linecap="round"/>
        <circle cx="78" cy="-157" r="9" fill="#e5a77b"/>
        <!-- Front arm with rolled cuff -->
        <path d="M-22 -136 L-36 -94" stroke="#2563eb" stroke-width="15" stroke-linecap="round"/>
        <circle cx="-38" cy="-90" r="9" fill="#e5a77b"/>
        <!-- Neck + chin cast shadow -->
        <rect x="-10" y="-176" width="20" height="22" rx="6" fill="#e5a77b"/>
        <path d="M-10 -170 Q0 -160 10 -170 L10 -176 L-10 -176 Z" fill="#bf865f"/>
        <!-- Head 3/4 with nose & rim-lit hair -->
        <circle cx="0" cy="-204" r="34" fill="#e5a77b"/>
        <path d="M-34 -208 Q-20 -248 24 -236 Q38 -226 32 -204 Z" fill="#182436"/>
        <circle cx="12" cy="-202" r="4" fill="#0f172a"/>
        <circle cx="24" cy="-202" r="4" fill="#0f172a"/>
        <path d="M18 -200 L22 -192 L17 -190" fill="none" stroke="#b97d56" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M10 -184 Q18 -176 26 -184" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- Subtle Volumetric Light Beam (top-left → bottom-right Light Direction Anchor) -->
      <polygon points="0,0 160,0 560,518 330,518" fill="#fff6d6" opacity="0.14"/>
    </g>

    <!-- FG Plane: Soft dark 2-tone foreground bushes at bottom corners (Edge Anchors) -->
    <g id="layer-fg" fill="#1d4b43">
      <circle cx="16" cy="516" r="42"/>
      <circle cx="62" cy="524" r="30" fill="#276359"/>
      <circle cx="906" cy="518" r="44"/>
    </g>

    <!-- Technical Overlay Annotations -->
    <g id="stage-annotations">
      <!-- Zoom crop frame indicator -->
      <rect x="40" y="28" width="840" height="462" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="10 6"/>
      <rect x="52" y="38" width="228" height="24" rx="4" fill="#f59e0b"/>
      <text x="166" y="54" text-anchor="middle" class="tag">ZOOM WAJIB 1.08×–1.95× (ANTI-WIDE)</text>

      <!-- Callout: Ground plane -->
      <rect x="276" y="422" width="194" height="24" rx="4" fill="#0f172a" stroke="#22c55e"/>
      <text x="373" y="438" text-anchor="middle" class="mono">y = 0 + ch.sdJ (kontak tanah)</text>

      <!-- Callout: Diegetic text -->
      <rect x="614" y="138" width="224" height="24" rx="4" fill="#0f172a" stroke="#facc15"/>
      <text x="726" y="154" text-anchor="middle" class="mono">TEKS DIEGETIK SAJA (≥ 34 px)</text>
      <line x1="726" y1="162" x2="726" y2="180" class="callout-line"/>

      <!-- Callout: Lead Room -->
      <line x1="454" y1="246" x2="594" y2="246" stroke="#0f172a" stroke-width="2" stroke-dasharray="5 4"/>
      <rect x="462" y="218" width="128" height="22" rx="4" fill="#0f172a"/>
      <text x="526" y="233" text-anchor="middle" class="mono">LEAD ROOM →</text>
    </g>
  </g>

  <!-- Right Spec Sidebar: 10+ Moving Elements Checklist -->
  <g id="sidebar-specs" transform="translate(976, 80)">
    <rect width="268" height="518" rx="12" fill="#162033" stroke="#2b3a55" stroke-width="1.5"/>
    <text x="18" y="30" class="lbl" fill="#38bdf8">HUKUM ≥10 BENDA BERGERAK</text>
    <text x="18" y="48" class="note">Contoh elemen hidup di 1 panggung:</text>

    <g transform="translate(18, 68)" class="note">
      <text y="0">1. Awan melintas (BG parallax)</text>
      <text y="22">2. Sinar matahari berdenyut halus</text>
      <text y="44">3. Burung terbang melintasi langit</text>
      <text y="66">4. Asap cerobong naik via drift()</text>
      <text y="88">5. Panel surya berkilau siklis</text>
      <text y="110">6. Titik elektron via flowAlong()</text>
      <text y="132">7. Jarum meter gardu naik-turun</text>
      <text y="154">8. Kipas gardu berputar via spin()</text>
      <text y="176">9. LED indikator berkedip deterministik</text>
      <text y="198">10. Daun pohon bergoyang via sway()</text>
      <text y="220">11. Tokoh idle() + point() + kedip</text>
      <text y="242">12. Bayangan kaki ch.sdJ ikut gerak</text>
    </g>

    <line x1="18" y1="332" x2="250" y2="332" stroke="#334155"/>
    <text x="18" y="356" class="lbl" fill="#f59e0b">COLOR SCRIPT 70–20–10 &amp; 3 LAPIS</text>
    <text x="18" y="378" class="note">• 70% BG/Tanah: analogus kontras rendah</text>
    <text x="18" y="398" class="note">• 20% MG Arsitektur: 2.5D + 2-tone split</text>
    <text x="18" y="418" class="note">• 10% Fokus + FG gelap + Light Beam searah</text>

    <line x1="18" y1="436" x2="250" y2="436" stroke="#334155"/>
    <text x="18" y="460" class="lbl" fill="#22c55e">CEK ATURAN KERAS</text>
    <text x="18" y="480" class="note">• Nol tekstur kertas / grain / papan grafik</text>
    <text x="18" y="498" class="note">• Nol caption overlay; 1 arah cahaya utuh</text>
  </g>

  <!-- Footer bar -->
  <rect x="36" y="616" width="1208" height="72" rx="10" fill="#162033" stroke="#2b3a55"/>
  <text x="56" y="642" class="lbl" fill="#38bdf8">PRINSIP ANTI-COPY:</text>
  <text x="200" y="642" class="note">Jangan menyalin rumah/gardu energi di atas. Ekstrak strukturnya: 3 lapis kedalaman + tokoh di 1/3 layar menghadap aksi + teks diegetik ≥34 px + ≥10 gerak.</text>
  <text x="56" y="666" class="mono">Transisi antar panggung: cut() langsung (65–75%) atau slide('x', 96) / slide('y', 72) dengan blur ≤ 10 px (25–35%).</text>
</svg>
