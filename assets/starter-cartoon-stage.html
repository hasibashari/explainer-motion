  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    /* [KANVAS — 16:9 (1920×1080) | 9:16 (1080×1920)] */
const W=1920,H=1080;

/* ============================================================================
   [ENGINE — PERTAHANKAN 100%]
   Helper SVG, rig sendi aditif J(), panggung kamera logaritmik, & karakter.
   ============================================================================ */
const $=(s,r=document)=>r.querySelector(s);
const CX=W/2,CY=H/2,NS='http://www.w3.org/2000/svg',XL='http://www.w3.org/1999/xlink';
function fit(){const st=$('#stage');st.style.width=W+'px';st.style.height=H+'px';const s=Math.min(innerWidth/W,innerHeight/H);st.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();

const S=$('#scene');S.setAttribute('width',W);S.setAttribute('height',H);S.setAttribute('viewBox',`0 0 ${W} ${H}`);
function N(tag,a={},p=S){const n=document.createElementNS(NS,tag);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n;}
const G=(a={},p=S)=>N('g',a,p),R=(x,y,w,h,f,rx=0,p=S,a={})=>N('rect',{x,y,width:w,height:h,rx,fill:f,...a},p),
  CI=(cx,cy,r,f,p=S,a={})=>N('circle',{cx,cy,r,fill:f,...a},p),EL=(cx,cy,rx,ry,f,p=S,a={})=>N('ellipse',{cx,cy,rx,ry,fill:f,...a},p),
  PA=(d,f,p=S,a={})=>N('path',{d,fill:f||'none',...a},p),
  LN=(d,st,w,p=S,a={})=>N('path',{d,fill:'none',stroke:st,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round',...a},p),
  TX=(x,y,t,size,f,p=S,a={})=>{const n=N('text',{x,y,'font-size':size,fill:f,'font-weight':800,'text-anchor':'middle',...a},p);n.textContent=t;return n;},
  IMG=(href,x,y,w,h,p=S,a={})=>{const n=N('image',{x,y,width:w,height:h,...a},p);n.setAttributeNS(XL,'href',href);n.setAttribute('href',href);return n;},
  sh=(hex,f)=>{const n=parseInt(hex.slice(1),16),cl=v=>Math.min(255,Math.max(0,Math.round(v)));const r=cl(((n>>16)&255)*f),g=cl(((n>>8)&255)*f),b=cl((n&255)*f);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);};

/* Sendi aditif: kanal aksi (x,y,r) terpisah dari kanal idle (xIdle,yIdle,rIdle) */
const joints=[];
function J(el,tx=0,ty=0,sx=1,sy=1){
  const j={el,tx,ty,x:0,y:0,r:0,sx,sy,xIdle:0,yIdle:0,rIdle:0,
    apply(){el.setAttribute('transform',`translate(${(j.tx+j.x+j.xIdle).toFixed(2)},${(j.ty+j.y+j.yIdle).toFixed(2)}) rotate(${(j.r+j.rIdle).toFixed(2)}) scale(${j.sx.toFixed(3)},${j.sy.toFixed(3)})`);}};
  j.apply();joints.push(j);return j;
}
const shadow=(x,y,rx,p=S)=>{const g=G({},p);EL(0,0,rx,15,'#172E3C',g,{opacity:.14});return J(g,x,y);};

const defsS=N('defs',{},S);
const scenes=[];
function scene(name){
  const g=G({'data-name':name},S);g.style.display='none';
  const sc={name,g,cam:{x:CX,y:CY,lz:Math.log(1.1),ox:0,oy:0},
    z(){return Math.exp(sc.cam.lz);},
    apply(){const c=sc.cam,z=Math.exp(c.lz);g.setAttribute('transform',`translate(${(CX-(c.x+c.ox)*z).toFixed(2)},${(CY-(c.y+c.oy)*z).toFixed(2)}) scale(${z.toFixed(4)})`);}};
  sc.apply();scenes.push(sc);return sc;
}

/* Rig karakter modern (~5 tinggi kepala; telapak sepatu tepat di y=0, tinggi unscaled ~570 px → scale 0.60 ≈ 1 H / 342 px).
   facing (1|-1), pose ('3/4'|'front'|'side'|'back'), outfit ('jacket'|'shirt'|'tee'),
   hairStyle ('short'|'bob'|'bun'|'curly'|'hijab'|'cap'), expr ('netral'|'senang'|'kaget'|'berpikir'|'khawatir'|'yakin'),
   tangan 3 lapis (handBack → handSlot → handFront) dengan 9 gestur Bezier: relaxed|open|point|grip|carry|pinch|fist|thumbs|present */
const HEADS={},chars=[]; // isi HEADS bila memakai kepala raster Data URI (wajib single-file): {tokoh:{bbox:[x0,y0,x1,y1],src:{netral:'data:image/png;base64,...','netral-kedip':'...'}}}
function character(p,x,ground,scale,{who='tokoh',facing=1,pose='3/4',outfit='jacket',hairStyle='short',expr='netral',handR='relaxed',handL='relaxed',shirt='#2563EB',inner='#FFFDF7',pants='#1E3A5F',shoes='#1E293B',hair='#182436',skin='#E5A77B',accent='#F59E0B'}={}){
  const isSide=pose==='side',is34=pose==='3/4',isBack=pose==='back',sdJ=shadow(x,ground+4,68*scale,p);
  const place=G({transform:`translate(${x},${ground}) scale(${scale})`},p);
  const rootEl=G({},place),root=J(rootEl,0,0,facing,1),ref={root,place,who,scale,facing,pose,outfit,hairStyle,sdJ,hands:{}};
  /* Tangan 3 lapis: handBack (telapak belakang) → handSlot (prop) → handFront (jari & ibu jari menjepit di depan prop).
     Semua gestur memakai 1 siluet <path> Bezier organik menyatu + garis lipatan tipis (tanpa susunan <rect> kaku).
     Sumbu lokal +Y = ujung jari (searah lengan bawah), +X = sisi ibu jari. */
  const makeHand=(hBackEl,hFrontEl,col,defMode,side)=>{
    const modes={},cr=sh(col,.76),dk=sh(col,.90);
    const addMode=(name,buildBack,buildFront)=>{
      const on=defMode===name?1:0;
      const b=G({opacity:on},hBackEl),f=G({opacity:on},hFrontEl);
      if(buildBack)buildBack(b);
      if(buildFront)buildFront(f);
      modes[name]={back:b,front:f};
    };
    // 1. relaxed (default): tangan santai menggantung di sisi badan — 1 siluet organik + lipatan halus
    addMode('relaxed',g=>{
      PA('M -7.5 -6 C -9.5 1 -10.8 7 -10.5 14 C -10.2 19.5 -9.5 24.5 -8.5 27.5 C -7.6 30.2 -5.0 30.2 -4.5 27.2 C -4.0 29.8 -1.2 31.8 0.5 31.8 C 2.4 31.8 3.6 29.6 4.0 27.5 C 4.8 29.6 7.4 29.4 8.2 26.6 C 9.4 22.0 9.8 16.5 9.8 13.0 C 12.2 15.2 14.5 15.8 15.8 14.2 C 17.0 12.6 15.8 8.6 13.2 5.4 C 10.8 2.4 9.0 -1.5 7.5 -6 Z',col,g);
      LN('M -4.5 17.5 L -4.5 27.0 M 0.0 18.0 L 0.2 29.5 M 4.2 17.5 L 4.0 27.2',cr,.9,g,{opacity:.62});
    });
    // 2. open: 5 jari mekar luwes dalam 1 kontur Bezier tunggal + bayangan telapak tipis
    addMode('open',g=>{
      PA('M -7.5 -6 C -10.5 0 -13.0 5.5 -13.8 11.5 L -17.0 22.8 C -17.8 25.4 -14.2 26.8 -13.0 24.0 L -9.6 15.4 L -10.6 28.4 C -10.9 31.4 -6.8 31.8 -6.2 28.8 L -4.4 16.4 L -2.6 31.2 C -2.4 34.4 1.8 34.4 2.0 31.2 L 2.2 16.2 L 6.4 29.2 C 7.2 32.0 11.2 30.8 10.4 27.8 L 7.6 14.5 C 10.6 13.6 14.5 16.2 18.6 16.0 C 21.8 15.8 22.4 11.6 19.6 9.8 C 16.0 7.4 12.6 4.8 10.0 0.8 C 8.8 -1.6 8.2 -4.0 7.5 -6 Z',col,g);
      PA('M -7.5 11.5 C -2.5 15.5 3.5 15.5 7.5 11.0 C 4.5 17.5 -4.5 17.5 -7.5 11.5 Z',dk,g,{opacity:.48});
    });
    // 3. point: telunjuk meruncing lurus ke +Y, ibu jari menekuk halus (+X), 3 jari lipat menyatu di -X
    addMode('point',g=>{
      PA('M -7.5 -6 C -10.5 0 -11.8 6.5 -11.4 13.5 C -11.0 18.8 -8.2 21.0 -5.6 20.6 C -4.8 22.0 -2.0 22.4 -0.4 21.4 C 1.0 22.4 3.4 22.0 4.2 19.6 L 4.4 33.8 C 4.4 36.8 8.8 36.8 9.0 33.8 L 9.8 14.2 C 12.6 15.6 16.2 14.8 17.0 11.8 C 17.8 8.4 15.0 4.2 10.6 1.4 C 8.8 0.2 8.2 -2.6 7.5 -6 Z',col,g);
      PA('M -11.0 12.2 L 4.2 12.2 L 4.2 19.6 C 3.4 22.0 1.0 22.4 -0.4 21.4 C -2.0 22.4 -4.8 22.0 -5.6 20.6 C -8.2 21.0 -11.0 18.8 -11.0 12.2 Z',dk,g,{opacity:.32});
      LN('M 4.2 12.2 L 4.2 19.2 M -0.6 12.4 L -0.6 21.0 M -5.6 12.6 L -5.6 20.2 M 8.8 10.2 C 11.5 11.2 13.6 12.6 15.0 14.0',cr,.95,g);
    });
    // 4. grip: telapak di belakang tengah prop + 4 jari melingkari sisi kiri (-X) & ibu jari menjepit sisi kanan (+X) di DEPAN prop
    addMode('grip',
      g=>{PA('M -7.5 -6 C -11.2 1 -13.2 8 -13.0 21 C -12.6 27.5 12.6 27.5 13.0 21 C 13.2 8 11.2 1 7.5 -6 Z',dk,g);},
      g=>{
        // Bayangan kontak tipis di bawah 4 ujung jari agar jari terbaca tajam di atas layar terang
        PA('M -12.6 9.2 L -6.0 9.6 C -4.6 10.6 -4.6 29.2 -6.4 30.8 L -12.4 30.8 Z','#0F172A',g,{opacity:.18});
        // 4 ruas jari organik memeluk sisi tengah-kiri HP/prop
        PA('M -13.0 8.2 C -17.4 8.4 -17.6 13.4 -13.2 13.8 C -18.0 14.0 -18.2 19.2 -13.4 19.6 C -17.6 19.8 -17.6 24.8 -13.0 25.2 C -16.4 25.6 -16.2 30.0 -11.8 30.0 L -6.8 29.6 C -5.0 29.2 -4.8 25.6 -7.0 25.0 C -4.4 24.4 -4.4 20.0 -7.0 19.4 C -4.2 18.8 -4.2 14.2 -7.0 13.6 C -4.6 13.0 -4.8 8.6 -7.4 8.4 Z',col,g);
        LN('M -15.2 13.8 L -7.0 13.6 M -15.6 19.6 L -7.0 19.4 M -14.8 25.2 L -7.0 25.0',cr,.95,g);
        // Bayangan kontak ibu jari + ibu jari melengkung mantap di sisi kanan HP/prop
        PA('M 12.0 10.2 C 17.6 12.6 18.2 19.6 12.8 23.0 C 9.4 25.0 4.8 24.0 3.8 21.4 C 3.2 19.6 5.2 17.4 8.6 16.6 Z','#0F172A',g,{opacity:.16});
        PA('M 11.8 7.8 C 18.0 10.2 19.0 17.4 13.6 21.4 C 10.4 23.6 5.4 22.8 4.2 19.8 C 3.0 17.2 5.6 14.8 9.2 14.2 C 11.4 13.8 12.4 12.2 11.4 9.2 Z',col,g);
        LN('M 5.8 20.8 C 8.6 22.4 12.6 21.8 15.0 19.4',cr,.95,g);
      }
    );
    // 5. carry: punggung tangan di DEPAN prop (handFront) — 4 jari menggenggam melingkari tepi bawah & ibu jari menjepit tepi atas HP miring-horizontal (+14°)
    addMode('carry',
      g=>{
        // Ibu jari menjepit tepi atas-depan HP di balik bodi (+X)
        PA('M 6.0 1.8 C 11.4 3.2 15.8 6.0 15.4 9.8 C 15.0 12.2 11.4 12.2 7.8 10.4 Z',dk,g);
      },
      g=>{
        // Bayangan kontak punggung tangan di atas bodi belakang HP (klip rapi di dalam bodi HP miring +14°)
        PA('M -8.2 3.8 L 10.2 8.3 C 11.8 14.4 12.2 21.8 11.2 29.6 L -8.6 25.2 Z','#020617',g,{opacity:.24});
        // Punggung tangan organik menyambung dari pergelangan + 4 jari melingkar mencengkeram melewati tepi bawah HP miring (+14°)
        PA('M -7.5 -6 C -9.6 1 -10.6 7.5 -10.4 15.0 C -10.2 21.2 -9.6 25.8 -7.6 26.8 C -6.2 27.4 -5.4 26.4 -5.2 25.2 C -4.8 27.4 -3.6 28.4 -2.2 28.4 C -0.8 28.4 -0.4 27.4 -0.2 26.4 C 0.2 28.6 1.6 29.8 3.0 29.8 C 4.4 29.8 4.8 28.8 5.0 27.8 C 5.6 29.8 7.2 30.8 8.8 30.2 C 10.6 29.6 11.2 24.8 10.8 17.8 C 10.5 12.6 10.0 7.6 9.2 3.2 C 8.6 -0.2 8.2 -3.2 7.5 -6 Z',col,g);
        // Lengkungan buku jari menekuk mengikuti sudut tepi HP + 3 garis lipatan ruas jari
        PA('M -9.8 16.0 C -3.4 18.8 3.8 20.6 10.2 21.2 C 9.8 24.4 3.0 23.4 -3.6 21.8 C -8.6 20.6 -9.8 18.8 -9.8 16.0 Z',dk,g,{opacity:.34});
        LN('M -5.4 18.4 L -5.2 25.4 M -0.2 19.6 L -0.2 26.6 M 5.0 20.8 L 5.0 27.8',cr,.95,g);
      }
    );
    // 5. pinch: 3 jari mekar rileks (-X) + ujung telunjuk & ibu jari bertemu rapi di depan
    addMode('pinch',g=>{
      PA('M -7.5 -6 C -10.5 0 -12.0 6.5 -12.2 12.5 L -16.6 22.8 C -17.6 25.2 -14.2 26.8 -13.0 24.4 L -9.2 16.0 L -11.0 27.6 C -11.4 30.2 -7.8 30.8 -7.2 28.2 L -4.4 17.4 L -3.6 29.6 C -3.4 32.2 0.2 32.2 0.4 29.6 L 1.4 17.8 C 5.5 18.2 10.5 15.5 11.0 9.5 C 11.4 4.0 9.6 -1.5 7.5 -6 Z',sh(col,.95),g);
    },g=>{
      PA('M 2.0 12.0 C 3.4 18.8 5.6 23.8 8.2 27.0 C 9.8 28.8 12.4 27.4 11.6 24.8 C 10.2 21.2 8.4 16.8 7.8 11.4 Z',col,g);
      PA('M 8.4 2.2 C 15.8 5.2 19.6 13.8 17.2 22.0 C 16.0 26.0 12.4 28.2 10.4 26.8 C 8.8 25.6 10.0 23.4 12.0 21.6 C 14.0 19.6 14.0 12.8 10.0 9.4 Z',col,g);
    });
    // 6. fist: kepalan 1 siluet scalloped + 3 garis lipatan + ibu jari menyilang di depan
    addMode('fist',g=>{
      PA('M -7.5 -6 C -10.5 0 -12.0 5.5 -11.8 13.0 C -11.6 18.6 -8.8 20.6 -6.2 20.0 C -5.2 21.8 -2.2 22.2 -0.2 21.2 C 1.4 22.4 4.4 22.0 5.6 20.6 C 8.4 21.2 11.6 19.0 11.8 13.0 C 12.0 5.5 10.5 0 7.5 -6 Z',col,g);
      LN('M -6.2 12.4 L -6.2 19.6 M -0.2 12.6 L -0.2 21.0 M 5.6 12.4 L 5.6 20.2',cr,.95,g);
    },g=>{
      PA('M 10.8 3.2 C 14.8 6.4 14.2 13.4 8.8 14.8 L -1.2 15.2 C -4.6 15.2 -4.8 10.4 -1.2 9.8 L 8.0 9.0 C 10.0 8.6 10.4 7.0 9.4 4.6 Z',col,g);
      LN('M -2.2 15.4 L 9.4 14.8',cr,.95,g);
    });
    // 7. thumbs: ibu jari melengkung alami (+X) + 4 ruas lipat menyatu dengan 3 garis lipatan
    addMode('thumbs',g=>{
      PA('M -7.5 -6 C -10.4 0 -11.4 6.5 -11.0 13.5 C -10.6 18.8 -7.8 20.6 -5.4 20.2 C -4.2 22.0 -1.2 22.2 0.4 21.2 C 2.2 22.2 5.0 21.8 6.2 20.4 C 8.8 20.6 10.8 18.2 10.8 13.6 L 10.8 10.2 C 16.4 10.8 22.2 11.4 25.4 9.6 C 28.6 7.8 28.4 3.0 24.8 2.2 C 20.8 1.4 16.2 2.8 12.0 1.8 C 10.2 0.4 8.8 -2.2 7.5 -6 Z',col,g);
      PA('M -10.4 11.5 L 10.4 11.5 L 10.4 16.5 C 9.2 19.8 6.8 21.4 0.4 21.2 C -6.0 21.4 -10.0 19.4 -10.4 14.2 Z',dk,g,{opacity:.26});
      LN('M 5.6 11.2 L 5.6 19.8 M 0.4 11.6 L 0.4 20.8 M -5.2 11.4 L -5.2 19.8',cr,.95,g);
    });
    // 8. present: telapak menengadah luwes untuk menjelaskan / menawarkan konsep
    addMode('present',g=>{
      PA('M -7.5 -6 C -10.2 2 -11.2 10 -9.4 18.5 C -7.8 25.8 -2.2 31.4 4.8 33.4 C 7.6 34.2 9.4 31.2 7.4 29.2 C 4.4 26.2 2.6 22.2 3.2 18.2 C 6.0 19.8 10.2 21.4 13.8 21.2 C 16.6 21.0 17.0 17.4 14.4 16.0 C 11.4 14.4 8.8 11.6 8.4 7.8 C 8.0 3.2 8.2 -1.8 7.5 -6 Z',col,g);
      LN('M -5.5 14.0 C -3.8 21.0 0.0 26.0 4.5 28.5',cr,.95,g,{opacity:.58});
    });
    ref.hands[side]=modes;
  };

/* ============================================================================
   [RUNTIME & QC HUD — PERTAHANKAN 100%]
   ============================================================================ */
const q=new URLSearchParams(location.search);
function applyAll(){scenes.forEach(s=>s.apply());joints.forEach(j=>j.apply());}
tl.eventCallback('onUpdate',applyAll);
function activeScene(){return scenes.find(s=>s.g.style.display!=='none')||scenes[0];}
function start(){tl.play(0);}
tl.eventCallback('onComplete',()=>start());
gsap.ticker.add(()=>{if(!tl.paused()&&tl.time()>=DUR)start();});

function runAudit(){
  const issues=[],prevT=tl.time(),wasPaused=tl.paused();
  for(let i=0;i<=20;i++){const t=(DUR*i)/20;window.OPENER.seek(t);const sc=activeScene(),z=sc.z();
    if(z<1.08)issues.push(`t=${t.toFixed(2)}s [${sc.name}]: zoom ${z.toFixed(2)} < 1.08`);}
  S.querySelectorAll('text').forEach(el=>{const sz=parseFloat(el.getAttribute('font-size')||getComputedStyle(el).fontSize);
    if(sz<30)issues.push(`Teks "${el.textContent.trim()}" berukuran ${sz}px (< 30px)`);});
  if($('#stage').querySelector('section'))issues.push('Terdeteksi elemen <section> di dalam #stage (F-01: larangan pola slide)');
  chars.forEach(c=>{if(!c.sdJ||!c.sdJ.el||!c.sdJ.el.isConnected)issues.push(`Tokoh "${c.who}" tidak memiliki bayangan kaki sdJ aktif (F-02)`);});
  [...$('#stage').children,...$('#world').children].forEach(el=>{
    if(['world','scene','safeGuide','dbg'].includes(el.id))return;
    const txt=el.textContent.trim();if(txt)issues.push(`Teks HTML overlay di luar #scene: "${txt.slice(0,24)}" (wajib nol caption)`);
  });
  window.OPENER.seek(prevT);if(!wasPaused)tl.play();
  console.group('[Bang Motion Audit — Cartoon Stage v2.1]');
  if(!issues.length)console.log('LOLOS: semua panggung zoom ≥ 1.08, nol caption/<section>, rig & sdJ utuh, dan teks ≥ 30px.');
  else issues.forEach(m=>console.warn(m));
  console.groupEnd();
  return issues;
}
window.OPENER={W,H,DURATION:DUR,tl,ready:false,seek(t){tl.pause(t,false);applyAll();},play:start,audit:runAudit};

addEventListener('keydown',e=>{if(/^[rR]$/.test(e.key))start();if(e.code==='Space'){e.preventDefault();tl.paused()?tl.play():tl.pause();}});
if(q.has('debug')){
  const dbg=$('#dbg'),sc=$('#dScrub'),ck=$('#dClock'),info=$('#dInfo'),res=$('#dRes'),safe=$('#safeGuide');
  dbg.style.display='flex';let drag=false;
  gsap.ticker.add(()=>{
    if(!drag)sc.value=String(tl.time()/DUR*1000);
    ck.textContent=tl.time().toFixed(2)+'s';
    $('#dPlay').textContent=tl.paused()?'Putar':'Jeda';
    const ac=activeScene(),z=ac.z();
    info.textContent=`${ac.name} · z=${z.toFixed(2)}`;
    info.className='badge '+(z<1.08?'warn':'ok');
  });
  sc.addEventListener('pointerdown',()=>{drag=true;tl.pause();});
  addEventListener('pointerup',()=>drag=false);
  sc.addEventListener('input',()=>{window.OPENER.seek(sc.value/1000*DUR);});
  $('#dPlay').onclick=()=>tl.paused()?tl.play():tl.pause();
  $('#dSafe').onclick=()=>{safe.style.display=safe.style.display==='block'?'none':'block';};
  $('#dAudit').onclick=()=>{const iss=runAudit();res.style.display='inline-block';res.textContent=iss.length?`${iss.length} Peringatan`:'QC Lolos';res.className='badge '+(iss.length?'warn':'ok');};
}
document.fonts.ready.then(()=>{
  window.OPENER.seek(0);window.OPENER.ready=true;
  if(q.has('clean'))return;
  start();
});
